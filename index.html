<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5B21B6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>برنامج الزيارات</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Changa:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<link href="https://fonts.googleapis.com/css2?family=Changa:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{
  --v950:#1E0B3A; --v900:#2E1065; --v800:#4C1D95; --v700:#5B21B6; --v600:#7C3AED; --v500:#8B5CF6; --v400:#A78BFA; --v300:#C4B5FD; --v100:#EDE9FE; --v50:#F5F3FF;
  --clay:#A0522D; --clay-l:#F6E6DA; --amber:#E69138; --amber-l:#FDF0DF;
  --paper:#F7F5FC; --card:#FFFFFF; --ink:#1E1433; --muted:#6E6488; --line:#E7E2F3; --soft:#F1EDFA;
  --ok:#0A8560; --ok-l:#DDF6EC; --warn:#C47A12; --warn-l:#FDF0DF; --bad:#D9443A; --bad-l:#FDE6E4;
  --s1:#E5484D; --s2:#F08A3E; --s3:#E8B730; --s4:#7BBF4E; --s5:#13A26C;
  --sh:0 1px 2px rgba(46,16,101,.06),0 8px 24px rgba(46,16,101,.08);
  --sh-lg:0 20px 60px rgba(30,11,58,.28);
  --r:20px;
  --bg:linear-gradient(155deg,#3B0F7A 0%,#6D28D9 38%,#8B5CF6 70%,#B07CF7 100%);
  --nav-h:68px;
}
:root[data-theme="dark"]{
  --paper:#140A24; --card:#1F1433; --ink:#F1ECFB; --muted:#A99CC6; --line:#30244A; --soft:#271B3E;
  --v50:#241640; --v100:#2E1D52; --clay-l:#3A2418; --amber-l:#3A2A14; --ok-l:#12352A; --warn-l:#3A2A14; --bad-l:#3D1A1A;
  --sh:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3);
  --bg:linear-gradient(155deg,#1A0638 0%,#3B0F7A 45%,#5B21B6 100%);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme]){
    --paper:#140A24; --card:#1F1433; --ink:#F1ECFB; --muted:#A99CC6; --line:#30244A; --soft:#271B3E;
    --v50:#241640; --v100:#2E1D52; --clay-l:#3A2418; --amber-l:#3A2A14; --ok-l:#12352A; --warn-l:#3A2A14; --bad-l:#3D1A1A;
    --sh:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3);
    --bg:linear-gradient(155deg,#1A0638 0%,#3B0F7A 45%,#5B21B6 100%);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--v700);background-image:var(--bg);background-attachment:fixed;color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;font-size:15.5px;line-height:1.65;overscroll-behavior-y:contain}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:
  radial-gradient(600px 400px at 85% -5%,rgba(255,255,255,.18),transparent 60%),
  radial-gradient(500px 500px at -10% 30%,rgba(230,145,56,.16),transparent 60%);z-index:0}
h1,h2,h3,h4,.d,button,select,input,label,.chip{font-family:"Changa",sans-serif}
h1,h2,h3,h4{margin:0;line-height:1.3}
button{cursor:pointer;color:inherit}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px;position:relative;z-index:1}
.hide{display:none!important}

/* ===== البطل والشريط ===== */
.hero{color:#fff;padding:calc(10px + env(safe-area-inset-top)) 0 54px;position:relative;z-index:1}
.topbar{display:flex;align-items:center;gap:10px;min-height:52px}
.mark{width:40px;height:40px;border-radius:13px;background:linear-gradient(140deg,#B8693F,var(--clay));display:grid;place-items:center;box-shadow:0 6px 16px rgba(160,82,45,.45),inset 0 1px 0 rgba(255,255,255,.25);flex:none}
.tb-t{flex:1;min-width:0}
.tb-t b{display:block;font-family:Changa;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-t small{display:block;font-size:12.5px;opacity:.78;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.14);font-family:Changa;font-size:12.5px;backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.18);white-space:nowrap}
.coord-b{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;background:rgba(255,255,255,.2);color:#fff;font-family:Changa;font-size:13px;border:1px solid rgba(255,255,255,.3);white-space:nowrap;cursor:pointer}
.sync i{width:8px;height:8px;border-radius:50%;background:#5EEAD4;box-shadow:0 0 0 3px rgba(94,234,212,.25)}
.sync.busy i{background:#FDE68A;animation:pulse 1s infinite}
.sync.offline i{background:#FCA5A5}
@keyframes pulse{50%{opacity:.35}}
.hero h1{font-size:27px;font-weight:700;margin-top:18px;letter-spacing:-.2px}
.hero .sub{opacity:.82;font-size:14px;margin-top:2px}
.glass{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:18px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.kpi{padding:12px 14px}
.kpi .n{font-family:Changa;font-size:26px;font-weight:700;line-height:1.1}
.kpi .n small{font-size:14px;opacity:.7;font-weight:500}
.kpi .l{font-size:12.5px;opacity:.85}
.kpi.accent{background:linear-gradient(140deg,rgba(230,145,56,.38),rgba(230,145,56,.16));border-color:rgba(253,215,170,.4)}

/* ===== اللوحة ===== */
#app.shell{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
#app.shell>.panel{flex:1 0 auto}
.panel{background:var(--paper);border-radius:30px 30px 0 0;margin-top:-34px;min-height:60vh;position:relative;z-index:2;padding:22px 0 calc(var(--nav-h) + 40px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(30,11,58,.18)}
.enter-f{animation:inF .32s cubic-bezier(.2,.8,.2,1)}
.enter-b{animation:inB .32s cubic-bezier(.2,.8,.2,1)}
@keyframes inF{from{opacity:0;transform:translateX(-26px)}}
@keyframes inB{from{opacity:0;transform:translateX(26px)}}
.stack>*+*{margin-top:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:13px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px}
.sec-t{font-family:Changa;font-weight:600;font-size:17px;display:flex;align-items:center;gap:8px;margin:6px 2px 10px}
.sec-t:before{content:"";width:5px;height:18px;border-radius:3px;background:linear-gradient(var(--amber),var(--clay))}
.back{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:12px;height:38px;padding:0 12px;font-size:14px;backdrop-filter:blur(8px)}

/* ===== أزرار ===== */
.btn{border:0;border-radius:14px;padding:11px 18px;font-size:15px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;transition:transform .12s,filter .2s,box-shadow .2s;position:relative}
.btn:active{transform:scale(.97)}
.btn-p{background:linear-gradient(140deg,var(--v500),var(--v700));color:#fff;box-shadow:0 8px 20px rgba(91,33,182,.32)}
.btn-p:hover{filter:brightness(1.07)}
.btn-a{background:linear-gradient(140deg,#F2A65A,var(--amber));color:#3A1F06;box-shadow:0 8px 18px rgba(230,145,56,.3)}
.btn-ok{background:linear-gradient(140deg,#12A174,#0B7F58);color:#fff;box-shadow:0 8px 18px rgba(14,159,110,.3)}
.btn-g{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.btn-x{background:transparent;color:var(--bad);border:1.5px solid color-mix(in srgb,var(--bad) 40%,transparent)}
.btn-xs{background:var(--bad);color:#fff}
.btn-w{background:#fff;color:var(--v700)}
.btn[disabled]{opacity:.45;pointer-events:none;box-shadow:none}
.btn.busy{color:transparent!important;pointer-events:none}
.btn.busy:after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;animation:sp .7s linear infinite}
.btn-g.busy:after{border-color:var(--line);border-top-color:var(--v600)}
.btn-block{width:100%}
.ibtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;flex:none}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 11px;font-size:12.5px;font-weight:500;background:var(--soft);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-l);color:var(--ok)}
.chip.warn{background:var(--warn-l);color:var(--warn)}
.chip.bad{background:var(--bad-l);color:var(--bad)}
.chip.v{background:var(--v100);color:var(--v700)}
:root[data-theme="dark"] .chip.v{color:var(--v300)}
.chip.clay{background:var(--clay-l);color:var(--clay)}
:root[data-theme="dark"] .chip.clay{color:#EBA982}

/* ===== إدخال ===== */
.field{display:block}
.field>span{display:block;font-size:13.5px;font-weight:500;margin-bottom:6px;color:var(--muted);font-family:Changa}
input,select,textarea{width:100%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:11px 13px;font-size:16px;min-height:48px;outline:none;font-family:"IBM Plex Sans Arabic",sans-serif;transition:border-color .15s,box-shadow .15s}
textarea{min-height:120px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--v500);box-shadow:0 0 0 4px var(--v100)}
.search{position:relative}
.search input{padding-inline-start:42px;border-radius:16px}
.search svg{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:8px 14px;font-size:14px;font-weight:500;transition:all .15s}
.seg button.on{border-color:var(--v600);background:var(--v600);color:#fff;box-shadow:0 6px 14px rgba(124,58,237,.25)}
.tabs{display:flex;gap:4px;background:var(--soft);border-radius:14px;padding:4px;overflow-x:auto}
.tab{border:0;background:transparent;color:var(--muted);padding:8px 14px;border-radius:11px;font-size:14px;font-weight:500;white-space:nowrap;flex:1}
.tab.on{background:var(--card);color:var(--v700);box-shadow:var(--sh);font-weight:600}
:root[data-theme="dark"] .tab.on{color:var(--v300)}
.switch{width:52px;height:30px;border-radius:999px;background:var(--line);border:0;position:relative;transition:background .2s;flex:none}
.switch:after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:inset-inline-start .2s}
.switch.on{background:var(--v600)}
.switch.on:after{inset-inline-start:25px}

/* ===== الصور الرمزية وحلقات التقدّم ===== */
.av{position:relative;width:56px;height:56px;flex:none}
.av svg{position:absolute;inset:0;transform:rotate(-90deg)}
.av .in{position:absolute;inset:6px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:Changa;font-weight:700;font-size:17px}
.tcard{display:flex;gap:14px;align-items:center;cursor:pointer;transition:transform .15s,box-shadow .2s,border-color .2s;padding:14px}
.tcard:hover{transform:translateY(-2px);border-color:var(--v300)}
.tcard .b{flex:1;min-width:0}
.tcard h3{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score-pill{font-family:Changa;font-weight:700;font-size:17px;padding:4px 10px;border-radius:12px;background:var(--ok-l);color:var(--ok)}

/* ===== شريط التنقل ===== */
.bnav{position:fixed;inset-inline:12px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:30;height:var(--nav-h);display:flex;align-items:stretch;justify-content:space-around;padding:6px;border-radius:24px;background:rgba(255,255,255,.86);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);box-shadow:0 12px 40px rgba(30,11,58,.25);border:1px solid rgba(255,255,255,.6);max-width:560px;margin:0 auto}
:root[data-theme="dark"] .bnav{background:rgba(31,20,51,.86);border-color:rgba(255,255,255,.08)}
.bnav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;font-family:Changa;font-size:12px;color:var(--muted);border-radius:18px;transition:all .2s}
.bnav a.on{color:var(--v700);background:var(--v100)}
.bnav a{min-width:0}
.bnav a span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.bnav.n6 a{font-size:11px;letter-spacing:-.2px}
:root[data-theme="dark"] .bnav a.on{color:var(--v300)}
@media (min-width:900px){
  .bnav{position:absolute;top:calc(70px + env(safe-area-inset-top));bottom:auto;inset-inline:auto;left:50%;transform:translateX(-50%);height:50px;width:auto;padding:5px;background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.2);box-shadow:none}
  .topbar{margin-bottom:56px}
  :root[data-theme="dark"] .bnav{background:rgba(255,255,255,.08)}
  .bnav a{flex-direction:row;gap:7px;padding:0 16px;font-size:14px;color:rgba(255,255,255,.85)}
  .bnav a.on{background:#fff;color:var(--v700)}
  .bnav.n6 a{font-size:14px;letter-spacing:0}
  .bnav{max-width:none}
  .bnav a{flex:0 0 auto;white-space:nowrap}
  .bnav a span{max-width:none;overflow:visible;text-overflow:clip}
  .panel{padding-bottom:60px}
}

/* ===== الأوراق المنبثقة ===== */
.sheet-bg{position:fixed;inset:0;background:rgba(20,6,40,.5);backdrop-filter:blur(3px);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@media (min-width:700px){.sheet-bg{align-items:center}}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;padding:10px 20px calc(20px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.2,.8,.2,1);box-shadow:var(--sh-lg)}
@media (min-width:700px){.sheet{border-radius:28px;padding-top:18px}.sheet .grab{display:none}}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet h3{font-size:20px;margin-bottom:14px}
.sheet .acts{display:flex;gap:10px;margin-top:18px}
.sheet .acts .btn{flex:1}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:.3}}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 26px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--v950);color:#fff;padding:11px 18px;border-radius:14px;z-index:80;font-family:Changa;font-size:14.5px;box-shadow:var(--sh-lg);max-width:calc(100% - 32px);animation:up .25s;display:flex;gap:8px;align-items:center}
.toast.err{background:var(--bad)}
@keyframes sp{to{transform:rotate(360deg)}}

/* ===== هياكل التحميل ===== */
.sk{background:linear-gradient(90deg,var(--soft) 25%,var(--line) 50%,var(--soft) 75%);background-size:200% 100%;animation:shim 1.2s infinite;border-radius:14px}
@keyframes shim{to{background-position:-200% 0}}

/* ===== الدخول ===== */
.login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 16px calc(28px + env(safe-area-inset-bottom));position:relative;z-index:1;color:#fff}
.login .brandbig{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:22px;text-align:center}
.login .brandbig .mark{width:66px;height:66px;border-radius:22px}
.login h1{font-size:28px;font-weight:700}
.lcard{width:100%;max-width:440px;background:var(--card);color:var(--ink);border-radius:28px;padding:22px;box-shadow:var(--sh-lg)}
.lstep-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.lstep-h h2{font-size:18px;flex:1}
.school-list{max-height:46vh;overflow:auto;margin-top:12px;display:grid;gap:6px}
.school-list button{display:flex;align-items:center;gap:12px;text-align:start;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:10px 12px;font-size:14.5px;font-weight:500;transition:all .15s}
.school-list button:hover{border-color:var(--v400);background:var(--v50)}
.school-list .ini{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:700;color:#fff;flex:none}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.names button{border:1.5px solid var(--line);background:var(--card);border-radius:18px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13.5px;font-weight:500;line-height:1.35;transition:all .15s}
.names button:hover{border-color:var(--v400);transform:translateY(-2px)}
.names .ini{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:18px}
.names .role{font-size:11.5px;color:var(--muted)}
.pin-top{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.pin-top .ini{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:Changa;font-weight:700;font-size:21px}
.dots{display:flex;gap:12px;justify-content:center;margin:18px 0 6px;direction:ltr;min-height:16px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--v300);transition:all .15s}
.dots i.on{background:var(--v600);border-color:var(--v600);transform:scale(1.1)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px;direction:ltr}
.pad button{height:62px;border-radius:20px;border:0;background:var(--soft);font-size:25px;font-weight:600;transition:transform .08s,background .15s}
.pad button:active{transform:scale(.93);background:var(--v100)}
.pad .ok{background:linear-gradient(140deg,var(--v500),var(--v700));color:#fff}
.pad .ghost{background:transparent}

/* ===== الزيارات ===== */
.slot{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:18px;background:var(--card);box-shadow:var(--sh)}
.slot .n{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-family:Changa;font-weight:700;background:var(--soft);color:var(--muted);flex:none}
.slot.done .n{background:var(--ok-l);color:var(--ok)}
.slot.open .n{background:var(--amber-l);color:var(--warn)}
.slot .b{flex:1;min-width:0}
.slot.click{cursor:pointer;transition:transform .15s}
.slot.click:hover{transform:translateX(-3px)}
.timeline{position:relative;padding-inline-start:22px}
.timeline:before{content:"";position:absolute;inset-inline-start:7px;top:8px;bottom:8px;width:2px;background:var(--line);border-radius:2px}
.tl{position:relative;margin-bottom:12px}
.tl:before{content:"";position:absolute;inset-inline-start:-21px;top:20px;width:12px;height:12px;border-radius:50%;background:var(--v500);box-shadow:0 0 0 4px var(--v100)}
.bar{height:10px;border-radius:6px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--v400),var(--v700));border-radius:6px;transition:width .4s}

/* ===== العدّاد النصف دائري ===== */
.gauge{position:relative;width:230px;margin:0 auto}
.gauge svg{display:block;width:100%}
.gauge .val{position:absolute;left:0;right:0;bottom:2px;text-align:center}
.gauge .val b{display:block;font-family:Changa;font-size:44px;font-weight:800;line-height:1}
.gauge .val span{font-family:Changa;font-size:15px;font-weight:600}

/* ===== الساعة ===== */
.clock-disp{display:flex;justify-content:center;align-items:baseline;gap:4px;direction:ltr;font-family:Changa;font-weight:700;font-size:54px;line-height:1}
.clock-disp button{border:0;background:transparent;font:inherit;color:var(--muted);padding:2px 10px;border-radius:16px}
.clock-disp button.on{color:var(--v700);background:var(--v100)}
:root[data-theme="dark"] .clock-disp button.on{color:var(--v300)}
.dial{width:280px;max-width:100%;margin:12px auto 0;display:block;touch-action:none;user-select:none}
.dial text{font-family:Changa;font-size:15px;fill:var(--ink);pointer-events:none}
.dial text.inner{font-size:12.5px;fill:var(--muted)}
.dial text.sel{fill:#fff}
.timepair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.timetile{border:1.5px solid var(--line);background:var(--card);border-radius:18px;padding:10px 14px;text-align:start;transition:all .15s;display:flex;flex-direction:column;gap:4px;line-height:1.2;height:auto;font-family:Changa}
.timetile:hover{border-color:var(--v400)}
.timetile small{display:block;font-size:12.5px;color:var(--muted)}
.timetile b{display:block;font-family:Changa;font-size:26px;direction:ltr;text-align:right;color:var(--v700)}
:root[data-theme="dark"] .timetile b{color:var(--v300)}
.timetile b.empty{color:var(--muted);font-size:15px;font-weight:500;direction:rtl;text-align:start}
.timetile b.empty:before{content:"🕘 ";}
.days{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scroll-snap-type:x mandatory;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:none;width:62px;border:1.5px solid var(--line);background:var(--card);border-radius:18px;padding:8px 0;text-align:center;scroll-snap-align:center;transition:all .15s}
.day small{display:block;font-size:11.5px;color:var(--muted)}
.day b{display:block;font-family:Changa;font-size:22px;line-height:1.2}
.day.today{border-color:var(--amber)}
.day.on{background:linear-gradient(160deg,var(--v500),var(--v700));border-color:transparent;color:#fff;box-shadow:0 8px 18px rgba(91,33,182,.3)}
.day.on small{color:rgba(255,255,255,.8)}
.stepper{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:18px;padding:8px 10px;background:var(--card)}
.stepper .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.stepper .lb{flex:1;font-family:Changa;font-size:14px}
.stepper button{width:40px;height:40px;border-radius:12px;border:0;background:var(--soft);font-size:22px;font-weight:600;flex:none}
.stepper input{width:58px;min-height:40px;text-align:center;font-family:Changa;font-size:21px;font-weight:700;border:0;padding:0;background:transparent}
.stepper input:focus{box-shadow:none}

/* ===== الملء ===== */
.fillbar{position:fixed;inset-inline:0;bottom:0;z-index:30;background:rgba(255,255,255,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom))}
:root[data-theme="dark"] .fillbar{background:rgba(31,20,51,.9)}
.fillbar .wrap{display:flex;align-items:center;gap:12px}
.fillbar .info{flex:1;min-width:0;font-family:Changa;font-size:13.5px}
.focus{position:relative;min-height:340px;display:flex;flex-direction:column;padding:22px 20px 20px;border-radius:28px;overflow:hidden}
.focus:before{content:"";position:absolute;top:0;inset-inline:0;height:5px;background:linear-gradient(90deg,var(--amber),var(--clay))}
.focus .where{font-family:Changa;font-size:13px;color:var(--v600);font-weight:600}
:root[data-theme="dark"] .focus .where{color:var(--v300)}
.focus .q{font-family:Changa;font-size:23px;font-weight:600;line-height:1.45;margin:14px 0 20px;flex:1;display:flex;align-items:center}
.big5{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;direction:ltr}
.big5 button{aspect-ratio:1;max-height:76px;border-radius:20px;border:2px solid var(--line);background:var(--card);font-family:Changa;font-size:26px;font-weight:700;transition:all .15s}
.big5 button.on{color:#fff;border-color:transparent;transform:translateY(-3px);box-shadow:0 10px 20px rgba(0,0,0,.15)}
.ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px;direction:ltr}
.fnav{display:flex;gap:10px;margin-top:16px}
.fnav .btn{flex:1}
.slide-n{animation:slN .28s cubic-bezier(.2,.8,.2,1)}
.slide-p{animation:slP .28s cubic-bezier(.2,.8,.2,1)}
@keyframes slN{from{opacity:0;transform:translateX(-40px)}}
@keyframes slP{from{opacity:0;transform:translateX(40px)}}
.sv{width:44px;height:44px;border-radius:13px;border:1.5px solid var(--line);background:var(--card);font-family:Changa;font-weight:700;font-size:17px;transition:all .12s}
.sv.on{color:#fff;border-color:transparent}
.v1.on,.big5 .v1.on{background:var(--s1)}.v2.on,.big5 .v2.on{background:var(--s2)}.v3.on,.big5 .v3.on{background:var(--s3)}.v4.on,.big5 .v4.on{background:var(--s4)}.v5.on,.big5 .v5.on{background:var(--s5)}
.scale{display:flex;gap:6px;direction:ltr}
.axis{padding:0;overflow:hidden}
.axis>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;font-family:Changa;font-weight:600;font-size:15.5px}
.axis>summary::-webkit-details-marker{display:none}
.axis>summary .cnt{margin-inline-start:auto}
.item{padding:12px 16px;border-top:1px solid var(--line);display:grid;gap:8px}
@media (min-width:700px){.item{grid-template-columns:1fr auto;align-items:center}}
.item.miss .t:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--amber);margin-inline-end:7px;vertical-align:middle}
.tag{font-family:Changa;font-size:11px;color:var(--muted);margin-inline-start:6px;background:var(--soft);padding:1px 6px;border-radius:6px}
.numin{width:110px;text-align:center}
.mini-ring{width:44px;height:44px;position:relative;flex:none}
.mini-ring svg{transform:rotate(-90deg)}
.mini-ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:Changa;font-size:11.5px}

/* ===== أعمدة المدير ===== */
.kanban{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;align-items:flex-start}
.col{flex:none;width:260px;background:var(--soft);border-radius:20px;padding:10px;border:2px dashed transparent;transition:all .15s}
.col.over{border-color:var(--v500);background:var(--v50)}
.col h4{font-size:14.5px;display:flex;justify-content:space-between;align-items:center;padding:4px 6px 10px}
.kc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 11px;margin-bottom:8px;cursor:grab;box-shadow:var(--sh);font-size:14px}
.kc:active{cursor:grabbing}
.kc.drag{opacity:.4}
.kc small{display:block;color:var(--muted);font-size:12px}
.ticket{border:2px dashed var(--amber);background:var(--amber-l);border-radius:16px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.ticket b{font-family:Changa;font-size:24px;letter-spacing:6px;color:var(--clay);direction:ltr}
.code-big{font-family:Changa;font-size:44px;font-weight:800;letter-spacing:12px;text-align:center;color:var(--clay);background:var(--amber-l);border:2px dashed var(--amber);border-radius:20px;padding:14px;direction:ltr}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty svg{opacity:.4;margin-bottom:8px}
.banner{border-radius:16px;padding:11px 14px;font-family:Changa;font-size:14px;background:var(--warn-l);color:var(--warn)}
.banner.v{background:var(--v100);color:var(--v700)}
:root[data-theme="dark"] .banner.v{color:var(--v300)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{padding:10px;border-bottom:1px solid var(--line);text-align:start}
.tbl th{font-family:Changa;font-weight:600;color:var(--muted);font-size:12.5px}
.tbl-wrap{overflow-x:auto}
.ptr{position:fixed;top:calc(10px + env(safe-area-inset-top));left:50%;z-index:90;width:40px;height:40px;margin-left:-20px;border-radius:50%;background:#fff;box-shadow:var(--sh-lg);display:grid;place-items:center;color:var(--v700);transform:translateY(-70px);transition:transform .2s}
.ptr.go svg{animation:sp .7s linear infinite}
.trs{display:flex;flex-wrap:wrap;gap:8px}
.a4.codes{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(4,1fr);gap:0;padding:8mm}
.ccard{border:.3mm dashed #A99CC6;padding:4mm 5mm;display:flex;flex-direction:column;gap:1.4mm;font-size:8.5pt;color:#1B1530;overflow:hidden}
.ccard .ch{display:flex;justify-content:space-between;gap:2mm;font-size:7.5pt;color:#6E6488}.ccard .ch b{color:#4B2A8C;font-family:Changa}
.ccard .cn{font-family:Changa;font-weight:700;font-size:13pt;margin-top:1mm}
.ccard .cc{color:#6E6488;font-size:8pt}
.ccard .ck{display:flex;align-items:center;justify-content:space-between;background:#F3EEFF;border-radius:2.5mm;padding:2mm 4mm;margin:1mm 0}
.ccard .ck b{font-family:Changa;font-size:22pt;letter-spacing:3mm;color:#4B2A8C}
.ccard ol{margin:0;padding-inline-start:5mm;font-size:7.5pt;line-height:1.55}
.ccard .cb{display:flex;gap:4mm;align-items:center;margin-top:1mm}
.ccard .qr{width:30mm;height:30mm;flex:none;background:#fff;padding:1.5mm;border-radius:2mm;border:.2mm solid #E4DDF5}.ccard .qr svg{width:100%;height:100%;display:block}
.notif{display:flex;gap:10px;align-items:center;background:#FDECEC;color:#B42318;border-radius:14px;padding:12px 14px;font-weight:600}
.notif .dot{width:24px;height:24px;border-radius:50%;background:#E5484D;color:#fff;display:grid;place-items:center;font-size:14px;flex:none;box-shadow:0 0 0 4px #E5484D33}
.lsn{display:flex;gap:12px;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:12px 14px}
.lsn.click{cursor:pointer}.lsn.click:active{transform:scale(.99)}
.lsn .ck{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-family:Changa;font-weight:700;color:var(--muted);flex:none;font-size:13px}
.lsn.on{border-color:color-mix(in srgb,var(--ok) 40%,var(--line))}.lsn.on .ck{background:var(--ok);border-color:var(--ok);color:#fff}.lsn.on .ck svg{stroke:#fff;width:16px;height:16px}
.lsn.due{border-inline-start:4px solid var(--bad)}
.lsn .b{flex:1;min-width:0}
.bnav .badge{position:absolute;top:2px;inset-inline-end:calc(50% - 22px);min-width:18px;height:18px;border-radius:9px;background:#E5484D;color:#fff;font-size:11px;display:grid;place-items:center;padding:0 5px}
.glass-chip{background:rgba(255,255,255,.16)!important;color:#fff!important;border:1px solid rgba(255,255,255,.28)!important}
.card.miss,.timetile.miss,input.miss{border:1.5px solid var(--bad)!important}
.trs button{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:8px 12px;font-size:14px;display:inline-flex;gap:6px;align-items:center;transition:all .15s}
.trs button.on{border-color:var(--clay);background:var(--clay-l);color:var(--clay)}

/* ===== التقرير المطبوع A4 ===== */
.rp-bar{position:sticky;top:0;z-index:20;display:flex;gap:10px;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;color:#fff}
.rp-bar .t{flex:1;font-family:Changa;font-weight:600}
.rp-stage{padding:6px 0 40px;display:flex;justify-content:center;position:relative;z-index:1}
.rp-scale{transform-origin:top center}
.a4{width:210mm;min-height:297mm;background:#fff;color:#1B1530;padding:8mm 9mm;box-shadow:0 20px 60px rgba(0,0,0,.35);font-size:7.9pt;line-height:1.3;font-family:"IBM Plex Sans Arabic",sans-serif;display:flex;flex-direction:column}
.a4 *{print-color-adjust:exact;-webkit-print-color-adjust:exact}
.rh{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6mm;padding-bottom:2mm;border-bottom:.6mm solid #A0522D}
.rh .org{font-family:Changa;font-size:9pt;line-height:1.35}
.rh .org b{display:block;font-size:11pt;color:#7A3B1E}
.rh h1{font-family:Changa;font-size:15.5pt;color:#4C1D95;text-align:center;margin:0;line-height:1.2}
.rh h1 small{display:block;font-size:9pt;color:#6E6488;font-weight:500}
.rh .lg{justify-self:end;display:flex;align-items:center;gap:2.5mm;font-family:Changa;font-size:8pt;color:#6E6488;text-align:left}
.rh .lg i{width:11mm;height:11mm;border-radius:3mm;background:linear-gradient(140deg,#B8693F,#A0522D);display:grid;place-items:center}
.rinfo{display:grid;grid-template-columns:1fr 1.25fr 30mm;gap:0 4mm;margin-top:2mm}
.rinfo table{width:100%;border-collapse:collapse}
.rinfo td{padding:.55mm 1.5mm;border-bottom:.2mm solid #E7E2F3;vertical-align:top}
.rinfo td:first-child{color:#6E6488;font-family:Changa;width:24mm;white-space:nowrap}
.rinfo td:last-child{font-weight:600}
.rscore{border-radius:4mm;background:linear-gradient(160deg,#F5F3FF,#EDE9FE);border:.3mm solid #C4B5FD;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2mm}
.rscore b{font-family:Changa;font-size:23pt;line-height:1}
.rscore span{font-family:Changa;font-size:10pt;font-weight:600}
.rscore small{font-size:7pt;color:#6E6488}
.rsecs{columns:3;column-gap:3.5mm;margin-top:1.2mm;flex:1;column-fill:balance}
.rsec{break-inside:auto}
.rsec h3{font-family:Changa;font-size:8.8pt;background:#4C1D95;color:#fff;padding:.8mm 2.2mm;display:flex;justify-content:space-between;margin:0 0 1mm;border-radius:1.8mm;break-after:avoid}
.rax{break-inside:avoid;border:.2mm solid #E7E2F3;border-radius:1.8mm;overflow:hidden;margin-bottom:1.3mm}
.rax h4{font-family:Changa;font-size:7.9pt;background:#F5F3FF;color:#4C1D95;padding:.45mm 2mm;display:flex;justify-content:space-between;margin:0}
.rit{display:flex;align-items:center;gap:1.5mm;padding:.25mm 2mm;border-top:.15mm dashed #EEE9F7;line-height:1.22}
.rit .x{flex:1}
.rit .s{width:4.2mm;height:4.2mm;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:Changa;font-weight:700;font-size:6.8pt;flex:none}
.rit .c{font-family:Changa;font-weight:700;color:#4C1D95;min-width:5mm;text-align:center}
.rlegend{display:flex;gap:3mm;justify-content:center;font-size:6.8pt;color:#6E6488;margin:.6mm 0 0}
.rlegend i{display:inline-block;width:2.6mm;height:2.6mm;border-radius:50%;vertical-align:middle;margin-inline-end:1mm}
.rbox{border:.3mm solid #E7E2F3;border-radius:2.5mm;padding:1.3mm 2.6mm;margin-top:1.8mm;break-inside:avoid}
.rbox h5{font-family:Changa;font-size:9pt;margin:0 0 1mm;color:#4C1D95}
.rtr{display:flex;flex-wrap:wrap;gap:1mm 4mm;font-size:8pt}
.rtr span:before{content:"☐ ";color:#A99CC6}
.rtr span.on{font-weight:700;color:#7A3B1E}
.rtr span.on:before{content:"☑ ";color:#A0522D}
.rsign{display:grid;grid-template-columns:1fr 1.6fr 1fr;gap:3mm;margin-top:1.8mm;break-inside:avoid}
.rsign>div{border:.3mm solid #CFC6E6;border-radius:2.5mm;padding:1.5mm 2.6mm;min-height:19mm;display:flex;flex-direction:column}
.rsign h5{font-family:Changa;font-size:8.8pt;margin:0 0 1mm;color:#4C1D95}
.rsign .lines{flex:1;background:repeating-linear-gradient(transparent 0 5.6mm,#E7E2F3 5.6mm 5.8mm)}
.rsign .stamp{flex:1;display:grid;place-items:center}
.rsign .stamp i{width:22mm;height:22mm;border-radius:50%;border:.4mm dashed #C4B5FD;display:grid;place-items:center;font-family:Changa;font-size:7pt;color:#A99CC6;font-style:normal}
.rfoot{display:flex;justify-content:space-between;font-size:6.8pt;color:#A99CC6;margin-top:2mm;border-top:.2mm solid #E7E2F3;padding-top:1mm}
.a4+.a4{margin-top:10mm}
/* النموذج الفارغ */
.rit .bx{width:4.6mm;height:4.6mm;border-radius:50%;border:.3mm solid #A99CC6;flex:none;background:#fff}
.rit .bx.c{width:9mm;border-radius:1.2mm}
.rinfo.blank td:last-child{font-weight:400;color:#A99CC6;height:4.6mm}
.rinfo.blank td.f{color:#1B1530;font-weight:600}
.rscore.blank b{height:11mm;border-bottom:.3mm dotted #A99CC6;width:18mm;margin:1mm auto}
.rbox .nl{min-height:16mm;background:repeating-linear-gradient(transparent 0 5.2mm,#E7E2F3 5.2mm 5.4mm)}
/* تضييق تلقائي حين تكثر البنود لتبقى الاستمارة في صفحة واحدة */
.a4.tight .rit .bx{width:3.5mm;height:3.5mm}
.a4.tight .rit .bx.c{width:8mm}
.a4.tight .rit{padding:.1mm 2mm;line-height:1.15}
.a4.tight .rbox .nl{min-height:11mm}
.a4.tight .rsign>div{min-height:16mm}
.a4.tighter{font-size:7.3pt}
.a4.tighter .rax{margin-bottom:.8mm}
.a4.tighter .rinfo td{padding:.35mm 1.5mm}
.a4.tightest{font-size:6.8pt}
.p2h{display:flex;justify-content:space-between;align-items:center;padding-bottom:2.5mm;border-bottom:.6mm solid #A0522D}
.p2h h2{font-family:Changa;font-size:14pt;color:#4C1D95;margin:0;line-height:1.2}
.p2h h2 small{display:block;font-size:8.5pt;color:#6E6488;font-weight:500}
.p2h .badge{font-family:Changa;text-align:center;border-radius:3mm;padding:1.5mm 4mm;background:#F5F3FF;border:.3mm solid #C4B5FD;line-height:1.1}
.p2h .badge b{display:block;font-size:17pt}
.p2t{font-family:Changa;font-size:10.5pt;color:#4C1D95;margin:4mm 0 2mm;display:flex;align-items:center;gap:2mm}
.p2t:before{content:"";width:1.4mm;height:4.5mm;border-radius:1mm;background:linear-gradient(#E69138,#A0522D)}
.p2t small{font-family:"IBM Plex Sans Arabic";font-size:7.5pt;color:#6E6488;font-weight:400;margin-inline-start:auto}
.p2secs{display:grid;grid-template-columns:repeat(3,1fr);gap:3mm;margin-top:3mm}
.p2secs div{border-radius:3mm;padding:2mm 3mm;background:#F5F3FF;border:.25mm solid #E7E2F3}
.p2secs b{display:block;font-family:Changa;font-size:18pt;line-height:1.1}
.p2secs span{font-size:8pt;color:#6E6488}
.axc{display:grid;grid-template-columns:38mm 1fr 18mm;gap:1.3mm 3mm;align-items:center}
.axc .l{font-family:Changa;font-size:8.6pt;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.axc .l i{font-style:normal;color:#E69138}
.axc .tr{position:relative;height:5.4mm;background:#F3F0FA;border-radius:1.5mm;overflow:hidden}
.axc .tr .now{position:absolute;inset-inline-start:0;top:0;bottom:0;border-radius:1.5mm;display:flex;align-items:center;justify-content:flex-end;padding:0 1.5mm;color:#fff;font-family:Changa;font-weight:700;font-size:8pt}
.axc .tr .prev{position:absolute;inset-inline-start:0;bottom:0;height:1.3mm;background:#4C1D95;opacity:.45;border-radius:1mm}
.axc .d{font-family:Changa;font-size:8pt;text-align:center}
.axc .grid50{position:absolute;top:0;bottom:0;width:.2mm;background:rgba(76,29,149,.25)}
.rv{width:100%;border-collapse:collapse;font-size:8.3pt}
.rv th{font-family:Changa;font-weight:600;color:#6E6488;font-size:7.6pt;text-align:start;padding:1mm 1.5mm;border-bottom:.3mm solid #CFC6E6}
.rv td{padding:1.2mm 1.5mm;border-bottom:.2mm solid #E7E2F3;vertical-align:middle}
.rv td.n{font-family:Changa;color:#A99CC6;width:5mm}
.rv td.ax{color:#6E6488;font-size:7.6pt;width:30mm}
.rv td.w{width:52mm;background:repeating-linear-gradient(transparent 0 3.6mm,#E7E2F3 3.6mm 3.8mm)}
.rv.tall td{padding:2.6mm 1.5mm}
.rv.tall td.w{background:repeating-linear-gradient(transparent 0 4.6mm,#E7E2F3 4.6mm 4.8mm)}
.strong{display:flex;flex-wrap:wrap;gap:1.5mm}
.strong span{background:#DDF6EC;color:#0B7A55;border-radius:1.5mm;padding:.6mm 2mm;font-size:7.8pt}
@page{size:A4 portrait;margin:0}
@media print{
  body{background:#fff!important}
  body:before,.rp-bar,.bnav,.toast,.ptr,.sheet-bg{display:none!important}
  .rp-stage{padding:0;display:block;height:auto!important;overflow:visible!important}

const SB_URL = 'https://fgcpfyjubulcgbgemwqs.supabase.co';

const CID = Math.random().toString(36).slice(2, 10);   // هذا الجهاز: لا يُحدِّث نفسه بتنبيه صادر عنه

/* ============================== أدوات ============================== */

const wait = ms => new Promise(r => setTimeout(r, ms));
const buzz = (p = 10) => { try { navigator.vibrate && navigator.vibrate(p); } catch(e){} };

  plus:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',

  xls:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M9 13l4 5M13 13l-4 5"/></svg>',
  list:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>',

  road:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h11a3 3 0 0 1 0 6H9a3 3 0 0 0 0 6h11"/><circle cx="4" cy="6" r="1.6"/><circle cx="20" cy="18" r="1.6"/></svg>',

  print:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V3h12v6M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="7" rx="1"/></svg>',
  empty:'<svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>'
};

/* ============================== الحالة ============================== */
let S = {
  auth: LS.get('ishraf.auth'), B: null, L: { step: '' },
  q: '', filter: 'all', fillSession: {}, fidx: {}, kanban: LS.get('ishraf.kanban') !== false,
  fmode: LS.get('ishraf.fmode') || (matchMedia('(min-width:900px)').matches ? 'list' : 'focus'),
  lastDepth: 0, lastRoute: null
};
const bootKey = () => 'ishraf.boot.' + S.auth.school + '.' + S.auth.user;

/* ============================== النخب والأوراق ============================== */
function toast(msg, err){
  $$('.toast').forEach(x => x.remove());
  const t = document.createElement('div');
  t.className = 'toast' + (err ? ' err' : '');
  t.textContent = msg;
  document.body.appendChild(t);
  if (err) buzz([20, 40, 20]);
  setTimeout(() => t.remove(), err ? 4200 : 2400);
}

function sheet(html, onMount, onClose){
  const bg = document.createElement('div');
  bg.className = 'sheet-bg';
  bg.innerHTML = '<div class="sheet"><div class="grab"></div>' + html + '</div>';
  document.body.appendChild(bg);
  let closed = false;
  const close = () => { if (closed) return; closed = true; bg.remove(); if (onClose) onClose(); };
  bg.addEventListener('click', e => { if (e.target === bg) close(); });
  bg.querySelectorAll('[data-close]').forEach(b => b.onclick = close);
  // سحب الورقة للأسفل لإغلاقها
  const sh = bg.querySelector('.sheet');
  let y0 = null;
  sh.addEventListener('touchstart', e => { if (sh.scrollTop <= 0 && e.target.closest('.grab,h3')) y0 = e.touches[0].clientY; }, { passive: true });
  sh.addEventListener('touchmove', e => { if (y0 === null) return; const dy = e.touches[0].clientY - y0; if (dy > 0) sh.style.transform = `translateY(${dy}px)`; }, { passive: true });
  sh.addEventListener('touchend', e => { if (y0 === null) return; const dy = e.changedTouches[0].clientY - y0; y0 = null; if (dy > 110) close(); else sh.style.transform = ''; });
  if (onMount) onMount(sh, close);
  return close;
}
function confirmBox(title, text, okLabel, cls){
  return new Promise(res => {
    let ok = false;
    sheet(`<h3>${esc(title)}</h3><p style="margin:0">${text}</p><div class="acts"><button class="btn btn-g" data-close>إلغاء</button><button class="btn ${cls || 'btn-p'}" id="cfOk">${esc(okLabel || 'تأكيد')}</button></div>`,
      (m, close) => { m.querySelector('#cfOk').onclick = () => { ok = true; close(); }; },
      () => res(ok));
  });
}
async function busy(el, fn){
  if (el) el.classList.add('busy');
  try { return await fn(); } finally { if (el) el.classList.remove('busy'); }
}

/* ============================== السمة ============================== */
// «تلقائي» يُترجم إلى ليلي أو نهاري حسب الهاتف، فتنطبق نفس قواعد الألوان في الحالتين
const DARK_MQ = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;
function applyTheme(){
  const t = LS.get('ishraf.theme');
  const eff = t === 'dark' || t === 'light' ? t : (DARK_MQ && DARK_MQ.matches ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', eff);
  const m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = eff === 'dark' ? '#1A0638' : '#5B21B6';
}
applyTheme();
if (DARK_MQ) (DARK_MQ.addEventListener ? DARK_MQ.addEventListener('change', applyTheme) : DARK_MQ.addListener(applyTheme));

/* ============================== الاتصال ============================== */
async function api(action, payload = {}){
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 35000);
  let res;
  try{
    res = await fetch(API_URL, {
      method: 'POST', signal: ctl.signal,
      headers: { 'Content-Type': 'application/json', apikey: SB_KEY },
      body: JSON.stringify({ req: Object.assign({ action, cid: CID, auth: S.auth ? { school: S.auth.school, user: S.auth.user, code: S.auth.code } : null }, payload) })
    });
  } catch(e){
    const err = new Error('تعذّر الاتصال بالخادم، تحقق من الإنترنت'); err.net = true; throw err;
  } finally { clearTimeout(timer); }
  let j;
  try { j = await res.json(); } catch(e){ const err = new Error('ردّ غير مفهوم من الخادم'); err.net = true; throw err; }
  if (!res.ok){ const err = new Error(res.status >= 500 ? 'الخادم مشغول، أعد المحاولة' : (j && j.message) || 'خطأ في الاتصال'); err.net = res.status >= 500; throw err; }
  if (!j.ok) throw new Error(j.error || 'خطأ غير معروف');
  return j.data;
}

/* ===== اللحظية: قناة المدرسة — أي تغيير من جهاز آخر يُحدّث الشاشة خلال ثانية ===== */
const RT = { ws: null, topic: '', ref: 0, hb: null, retry: 0, timer: null, idle: null, want: '' };
function rtConnect(topic){
  RT.want = topic || RT.want;
  if (!RT.want || !/^https?:/.test(SB_URL) || typeof WebSocket === 'undefined') return;
  if (RT.ws && RT.topic === RT.want && RT.ws.readyState <= 1) return;
  rtClose(true);
  let ws;
  try { ws = new WebSocket(SB_URL.replace(/^http/, 'ws') + '/realtime/v1/websocket?apikey=' + encodeURIComponent(SB_KEY) + '&vsn=1.0.0'); } catch(e){ return; }
  RT.ws = ws; RT.topic = RT.want;
  const send = (topic, event, payload) => { try { ws.send(JSON.stringify({ topic, event, payload, ref: String(++RT.ref) })); } catch(e){} };
  ws.onopen = () => {
    RT.retry = 0;
    send('realtime:' + RT.topic, 'phx_join', { config: { broadcast: { self: false, ack: false }, presence: { key: '' }, private: false } });
    RT.hb = setInterval(() => send('phoenix', 'heartbeat', {}), 25000);
  };
  ws.onmessage = e => {
    let m; try { m = JSON.parse(e.data); } catch(x){ return; }
    if (m.event !== 'broadcast') return;
    const inner = m.payload || {}, body = inner.payload || {};
    if (body.cid && body.cid === CID) return;
    clearTimeout(RT.timer);
    RT.timer = setTimeout(() => { if (S.auth && S.B) refreshBg(); }, 700);   // عدة تنبيهات متتالية = تحديث واحد
  };
  ws.onclose = () => {
    clearInterval(RT.hb);
    if (RT.ws !== ws) return;
    RT.ws = null;
    if (!S.auth || document.hidden) return;
    RT.retry = Math.min(RT.retry + 1, 6);
    setTimeout(() => { if (!RT.ws && S.auth && !document.hidden) rtConnect(); }, 1000 * 2 ** RT.retry);
  };
}
function rtClose(keepWant){
  clearInterval(RT.hb);
  const ws = RT.ws; RT.ws = null;
  if (!keepWant) RT.want = '';
  try { ws && ws.close(); } catch(e){}
}
// التطبيق في الخلفية أكثر من دقيقة: نغلق القناة (حدّ الاتصالات المتزامنة)، وعند العودة نحدّث ونعيد فتحها
document.addEventListener('visibilitychange', () => {
  clearTimeout(RT.idle);
  if (document.hidden) RT.idle = setTimeout(() => rtClose(true), 60000);
  else if (S.auth && S.B){ if (!RT.ws) { rtConnect(); refreshBg(); } }
});

/* ===== طابور الحفظ في الخلفية (التحديث المتفائل) ===== */
const Q = { jobs: [], running: false };
function setSync(state){
  Q.state = state;
  $$('.sync').forEach(el => {
    el.className = 'sync ' + (state === 'ok' ? '' : state);
    el.querySelector('span').textContent = state === 'busy' ? 'يُحفظ…' : state === 'offline' ? 'غير متصل — سيُعاد' : 'محفوظ';
  });
}
function enqueue(job){ Q.jobs.push(job); setSync('busy'); runQ(); }
async function runQ(){
  if (Q.running) return;
  Q.running = true;
  while (Q.jobs.length){
    const j = Q.jobs[0];
    const payload = typeof j.payload === 'function' ? j.payload() : j.payload;
    if (payload === null){ Q.jobs.shift(); continue; }
    try{
      setSync('busy');
      const r = await api(j.action, payload);
      Q.jobs.shift();
      try { if (j.onOk) j.onOk(r, payload); } catch(err){ console.error(err); }
    } catch(e){
      if (e.net){ setSync('offline'); await wait(4000); continue; }
      Q.jobs.shift();
      if (j.onFail) j.onFail(e);
      toast(e.message, true);
      if (/الجلسة|الحساب|المؤقت/.test(e.message)) { logout(true); break; }
    }
  }
  Q.running = false;
  setSync('ok');
  persist();
}
window.addEventListener('beforeunload', e => { if (Q.jobs.length){ e.preventDefault(); e.returnValue = ''; } });

let persistT;
function persist(){ clearTimeout(persistT); persistT = setTimeout(() => { if (S.auth && S.B) LS.set(bootKey(), S.B); }, 300); if (S.auth && S.B && S.B.rt) rtConnect(S.B.rt); }

/* ============================== البيانات ============================== */
const B = () => S.B;
// المنسق التربوي يرى ما يراه المدير (للاطلاع فقط) في كل مدرسة من مدارسه
const isCoord = () => S.auth && S.auth.role === 'منسق تربوي';
const isDir = () => S.auth && (S.auth.role === 'مدير' || isCoord());
const isTeacher = () => S.auth && S.auth.role === 'معلم';
/** اسم التطبيق: «سيرورة الدروس» للمعلم، و«برنامج الزيارات» للمساعد والمدير */
const appName = () => (S.auth ? isTeacher() : LS.get('ishraf.mode') === 'sira') ? 'سيرورة الدروس' : 'برنامج الزيارات';
// رابط بطاقة المعلم: ?app=sira&s=رمز المدرسة → يفتح على «سيرورة الدروس» ومدرسته مختارة
(() => { try{
  const q = new URLSearchParams(location.search);
  if (q.get('app') === 'sira') LS.set('ishraf.mode', 'sira');
  if (q.get('s')){ const l = LS.get('ishraf.last') || {}; l.school = q.get('s'); LS.set('ishraf.last', l); }
  if (q.has('app') || q.has('s')) history.replaceState(null, '', location.pathname + location.hash);
} catch(e){} })();
const ASST = 'مساعد بيداغوجي';
const isAsst = u => u && (u.role === ASST || u.role === 'مشرف');
/** المساعد الرئيسي: يضيف المعلمين ويُسندهم ويضيف المساعدين (المدير للاطلاع فقط) */
const isMain = () => !!(S.B && S.B.me && S.B.me.main);
const seeAll = () => isDir() || isMain();
const assts = () => B().users.filter(isAsst);
const tName = t => t ? `${t.last} ${t.first}` : '—';
const allTeachers = () => B().teachers.concat(B().extraTeachers || []);
const teacher = id => allTeachers().find(t => t.id === id);
const user = id => B().users.find(u => u.id === id);
const userName = id => (user(id) || {}).name || '—';
/** أقسام المعلمين المفعّلين فقط (الموقوف لا يدخل في المتابعة) */
const activeAssignments = () => (B().assignments || []).filter(a => { const t = B().teachers.find(x => x.id === a.teacher); return !t || t.active !== false; });
const hasData = tid => B().visits.some(v => v.teacher === tid) || (B().lessonLog || []).some(x => x[4] === tid);
const visitsOf = tid => B().visits.filter(v => v.teacher === tid).sort((a, b) => a.number - b.number);
const sessionsOf = vid => B().sessions.filter(s => s.visit === vid).sort((a, b) => a.number - b.number);
const resultsOf = vid => (B().results[vid] = B().results[vid] || {});
/** منصب المعلم: قرآن / مادة / قسم («الكل» القديمة = قسم) */
const post = r => { const s = String(r ?? '').trim().replace(/\s+/g, ' ').replace(/^معلم\s*/, ''); return !s || s === 'الكل' ? 'قسم' : s; };
/** البنود الخاصة بزيارة: المنصب ↔ المحور · نوع الحصة (تلقين/منافسة) ↔ البند · رقم الزيارة ↔ البند */
const itemsFor = (role, type, n) => {
  const cfg = B().cfg; role = post(role);
  // «الكل» = كل المعلمين؛ والمنصب يُقبل بصيغتيه («معلم مادة» = «مادة»)
  const axOk = new Set(cfg.axes.filter(a => !String(a.role || '').trim() || a.role === 'الكل' || role === 'قسم' || post(a.role) === role).map(a => a.id));
  const vn = String(Math.min(Number(n) || 1, cfg.maxVisit || 1));
  return cfg.items.filter(it => axOk.has(it.axis) && (it.scope === 'الكل' || it.scope === type) && (!it.visits || it.visits.includes('الكل') || it.visits.includes(vn)));
};
const visitItems = v => { const t = teacher(v.teacher); return itemsFor(t && t.role, v.type || (t && t.type), v.number); };
const ROLE_LABEL = { 'قرآن': 'معلم قرآن', 'مادة': 'معلم مادة', 'قسم': 'معلم قسم', 'الكل': 'معلم قسم' };
const axisOf = id => B().cfg.axes.find(a => a.id === id);
const visitById = id => B().visits.find(v => v.id === id);
const draftKey = vid => 'ishraf.draft.' + S.auth.school + '.' + vid;
const getDraft = vid => LS.get(draftKey(vid)) || {};
const setDraft = (vid, d) => Object.keys(d).length ? LS.set(draftKey(vid), d) : LS.del(draftKey(vid));
const valueOf = (vid, id) => { const d = getDraft(vid); if (d[id] !== undefined) return d[id]; const r = resultsOf(vid)[id]; return r ? r.value : undefined; };

const PALETTE = ['#7C3AED','#A0522D','#0B7F58','#BE185D','#2563EB','#B45309','#0E7490','#9333EA','#C2410C','#4F46E5'];
function hue(str){ let h = 0; for (const c of String(str)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return PALETTE[h % PALETTE.length]; }
function initials(name){ const p = String(name || '').trim().split(/\s+/); return ((p[0] || '')[0] || '') + ((p[1] || '')[0] || ''); }
function avGrad(name){ const c = hue(name); return `background:linear-gradient(140deg,${c},${c}E6)`; }

function progress(v){
  const items = visitItems(v);
  const done = items.filter(it => valueOf(v.id, it.id) !== undefined).length;
  return { done, total: items.length, pct: items.length ? Math.round(done * 100 / items.length) : 0 };
}
/** نفس حساب الخادم: البند → المحور (معامل البند) → القسم (معامل المحور) → النقطة (وزن القسم حسب الوظيفة) */
function computeScore(items, scores, role){
  const cfg = B().cfg;
  const perAxis = {}, secSum = {}, secW = {};
  cfg.axes.forEach(ax => {
    let s = 0, w = 0;
    items.forEach(it => { if (it.axis === ax.id && it.kind === 'علامة' && scores[it.id] !== undefined){ const iw = it.weight ?? 1; s += Number(scores[it.id]) * iw; w += iw; } });
    if (!w) return;
    perAxis[ax.id] = s / w;
    if (ax.coef > 0){ secSum[ax.section] = (secSum[ax.section] || 0) + perAxis[ax.id] * ax.coef; secW[ax.section] = (secW[ax.section] || 0) + ax.coef; }
  });
  const perSection = {}; Object.keys(secW).forEach(k => perSection[k] = secSum[k] / secW[k]);
  const weights = (cfg.sectionWeights || {})[post(role)];
  let tot = 0, tw = 0;
  if (weights) Object.keys(perSection).forEach(k => { const w = weights[k] || 0; if (w > 0){ tot += perSection[k] * w; tw += w; } });
  if (!tw) Object.keys(secW).forEach(k => { tot += secSum[k]; tw += secW[k]; });
  const score = tw ? Math.round(((tot / tw - cfg.min) / (cfg.max - cfg.min)) * 1000) / 10 : null;
  let grade = '';
  if (score !== null) cfg.scale.forEach(s => { if (score >= s.min) grade = s.label; });
  return { score, grade, perAxis, perSection };
}
function scoreColor(s){ return s === null || s === undefined || s === '' ? '#8B80A6' : s < 50 ? '#E5484D' : s < 65 ? '#F08A3E' : s < 80 ? '#5FAE3A' : '#13A26C'; }
async function drain(ms = 20000){ const t0 = Date.now(); while ((Q.jobs.length || Q.running) && Date.now() - t0 < ms) await wait(200); }
function teacherState(t){
  const vs = visitsOf(t.id);
  if (vs.some(v => v.status === 'مفتوحة')) return 'open';
  if (vs.filter(v => v.status === 'مكتملة').length >= t.planned) return 'done';
  return vs.length ? 'progress' : 'none';
}

/* ============================== مكوّنات مرئية ============================== */
function ring(pct, color, size = 56, stroke = 4){
  const r = size / 2 - stroke / 2 - 1, c = 2 * Math.PI * r;
  return `<svg width="${size}" height="${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--line)" stroke-width="${stroke}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - Math.min(1, pct))}" style="transition:stroke-dashoffset .6s"/></svg>`;
}
function avatar(name, pct, color){
  return `<div class="av">${ring(pct, color)}<div class="in" style="${avGrad(name)}">${esc(initials(name))}</div></div>`;
}
function miniRing(done, total){
  const pct = total ? done / total : 0;
  return `<div class="mini-ring">${ring(pct, pct >= 1 ? 'var(--ok)' : 'var(--v600)', 44, 4)}<b>${Math.round(pct * 100)}%</b></div>`;
}
function gauge(score, grade, id){
  const r = 90, c = Math.PI * r;
  const pct = score === null || score === undefined ? 0 : score / 100;
  return `<div class="gauge" id="${id || 'g'}" data-score="${score ?? ''}">
    <svg viewBox="0 0 220 124"><path d="M20 112 A90 90 0 0 1 200 112" fill="none" stroke="var(--line)" stroke-width="16" stroke-linecap="round"/>
      <path class="arc" d="M20 112 A90 90 0 0 1 200 112" fill="none" stroke="${scoreColor(score)}" stroke-width="16" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c}" data-target="${c * (1 - pct)}" style="transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)"/></svg>
    <div class="val"><b style="color:${scoreColor(score)}">${score === null || score === undefined ? '—' : '0'}</b><span style="color:${scoreColor(score)}">${esc(grade || '')}</span></div></div>`;
}
function animateGauges(){
  $$('.gauge').forEach(g => {
    const arc = g.querySelector('.arc'), b = g.querySelector('.val b');
    const target = parseFloat(g.dataset.score);
    requestAnimationFrame(() => requestAnimationFrame(() => { arc.style.strokeDashoffset = arc.dataset.target; }));
    if (isNaN(target)) return;
    const t0 = performance.now();
    const step = now => { const k = Math.min(1, (now - t0) / 1100); const e = 1 - Math.pow(1 - k, 3); b.textContent = (Math.round(target * e * 10) / 10).toString(); if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}
function emptyBox(text){ return `<div class="card empty">${IC.empty}<div>${text}</div></div>`; }
function skeleton(){
  return `<div class="hero"><div class="wrap"><div class="topbar"><div class="mark">${IC.book}</div><div class="tb-t"><b>برنامج الزيارات</b><small>جارٍ التحميل…</small></div></div>
    <div class="sk" style="height:30px;width:55%;margin-top:22px;opacity:.35"></div>
    <div class="kpis">${'<div class="sk" style="height:74px;opacity:.3"></div>'.repeat(3)}</div></div></div>
    <div class="panel"><div class="wrap stack">${'<div class="sk" style="height:84px"></div>'.repeat(5)}</div></div>`;
}

const ROUTES_DEPTH = { '': 0, sup: 0, tea: 0, vis: 0, visits: 0, prog: 0, stats: 0, me: 0, t: 1, cls: 1, v: 2, fill: 3, close: 3, report: 3, codes: 3, blank: 3 };
function go(h){ if (location.hash === h) render(); else location.hash = h; }
window.addEventListener('hashchange', () => render());

function route(){ const p = location.hash.replace(/^#\/?/, '').split('/'); return { r: p[0] || '', id: p[1] }; }

/** مدارسه مع مؤشراتها: الزيارات المنجزة من المقررة، متوسط النتائج، الدروس المسجلة — والضغط على مدرسة ينقله إليها */
function coordSchools(){
  buzz();
  const list = B().mySchools || [];
  const card = (code, inner) => `<button class="card stack" data-act="switchSchool" data-s="${esc(code)}" style="text-align:start;gap:8px;width:100%;border:${code === S.auth.school ? '2px solid var(--v500)' : '1px solid var(--line)'}">${inner}</button>`;

            <div class="small muted">${r.done} / ${r.planned} زيارة مكتملة (${pct}%)${r.open ? ` · <span style="color:var(--warn)">${r.open} مفتوحة</span>` : ''}</div>
            <div class="small muted">${r.supervisors} مساعد · ${r.teachers} معلم · متوسط النتائج ${r.avg == null ? '—' : esc(String(r.avg))} · ${r.lessons} درسًا مسجّلًا${r.lastVisit ? ' · آخر زيارة ' + esc(r.lastVisit) : ''}</div>`);
        }).join('') || emptyBox('لا توجد مدارس مسندة إليك. تضيفها الإدارة العامة في ورقة المستخدمين.');

function switchSchool(code){
  document.querySelectorAll('.sheet-bg').forEach(x => x.remove());
  if (!code || code === S.auth.school) return;
  rtClose();
  S.auth.school = code; LS.set('ishraf.auth', S.auth);
  S.B = null; location.hash = '#/';

}

async function boot(){
  if (!S.auth) return render();
  const cached = LS.get(bootKey());
  if (cached && cached.cfg){ S.B = cached; render(); refreshBg(); return; }
  $('#app').innerHTML = skeleton();
  try { const t0 = performance.now(); S.B = await api('bootstrap'); notePerf(S.B, t0); persist(); render(); }
  catch(e){ handleAuthError(e) || ($('#app').innerHTML = `<div class="login"><div class="lcard stack"><div class="banner">${esc(e.message)}</div><button class="btn btn-p btn-block" onclick="boot()">إعادة المحاولة</button></div></div>`); }
}
/** زمن آخر تحميل: الكلي (مع الشبكة) وزمن الخادم، للتشخيص في «حسابي» */
function perfLine(){
  const p = LS.get('ishraf.perf'); if (!p) return '';
  const sec = ms => (ms / 1000).toFixed(1).replace('.0', '') + ' ث';
  const err = LS.get('ishraf.lastErr');
  const ago = Math.round((Date.now() - (p.at || 0)) / 60000);
  return ` · آخر تحميل ${sec(p.total)}` + ` <span style="opacity:.7">[${ago < 1 ? 'الآن' : 'قبل ' + ago + ' د'}]</span>` + (p.server != null ? ` (الخادم ${sec(p.server)}${p.cache ? '، من الذاكرة' : ''})` : '')
    + `<br>الخادم ${p.srv ? esc(p.srv) : '<b style="color:var(--bad)">قديم: انشر Code.gs الجديد</b>'}`
    + (err ? `<br><span style="color:var(--bad)">آخر خطأ في التحديث: ${esc(err.msg)}</span>` : '');
}
function notePerf(b, t0){
  try{
    const p = (b && b.perf) || [], srv = p.length ? p[p.length - 1][1] : null;
    LS.set('ishraf.perf', { total: Math.round(performance.now() - t0), server: srv, cache: p.some(x => x[0] === 'cache'), srv: (b && b.srv) || '', at: Date.now() });
    LS.del('ishraf.lastErr');
    if (b) { delete b.perf; delete b.srv; }
    const el = document.getElementById('perfLine'); if (el) el.innerHTML = perfLine();
  }catch(e){}
}
function handleAuthError(e){
  if (/الجلسة|الحساب|المؤقت/.test(e.message)){ logout(true); toast(e.message, true); return true; }
  return false;
}
async function refreshBg(force){
  if (Q.jobs.length || (Q.running && !force)) return;
  try{
    setSync('busy');
    const t0 = performance.now();
    const fresh = await api('bootstrap', force ? { fresh: true } : {});
    notePerf(fresh, t0);
    setSync('ok');
    if (Q.jobs.length) return;
    if (JSON.stringify(fresh) !== JSON.stringify(S.B)){
      S.B = fresh; persist();
      if (!$('.sheet-bg') && !document.activeElement.matches('input,textarea')) render(true);
    }
  } catch(e){ setSync(e.net ? 'offline' : 'ok'); if (!e.net) LS.set('ishraf.lastErr', { msg: e.message, at: Date.now() }); const el = document.getElementById('perfLine'); if (el) el.innerHTML = perfLine(); handleAuthError(e); }
}
function logout(silent){
  if (S.auth) LS.del(bootKey());
  rtClose();
  S.auth = null; S.B = null; LS.del('ishraf.auth'); S.L = { step: '' };
  if (!silent) toast('تم الخروج');
  history.replaceState(null, '', location.pathname);
  render();
}

function render(keep){
  $('#app').classList.remove('shell');
  // أثناء التحميل الأول نعرض الهياكل، ولا نعود لشاشة الدخول إلا إن لم يكن هناك حساب
  if (S.auth && !S.B && !['new1', 'new2'].includes(S.L.step)){ $('#app').innerHTML = skeleton(); return; }
  if (!S.auth || !S.B) return renderLogin();
  program();   // تحميل البرنامج الدراسي في الخلفية (مرة واحدة)
  if (!['report', 'codes', 'blank'].includes(route().r)) document.title = appName();
  const { r, id } = route();
  const depth = ROUTES_DEPTH[r] ?? 0;
  const anim = S.lastRoute === location.hash ? '' : depth >= S.lastDepth ? 'enter-f' : 'enter-b';
  if (S.lastRoute !== location.hash && !keep) window.scrollTo(0, 0);
  S.lastRoute = location.hash; S.lastDepth = depth;
  const y = scrollY;
  if (r === 'report') return renderReport(id);
  if (r === 'codes') return renderCodes();
  if (r === 'blank' && !isTeacher()) return renderBlank(id);
  let v;
  if (isTeacher()) v = r === 'me' ? viewMe() : r === 'cls' ? viewLessons(id) : viewTeacherHome();
  else if (r === 'prog') v = viewProgress();
  else if (r === 'cls') v = viewLessons(id);
  else if (r === 'stats') v = viewStats();
  else if (r === 't') v = viewTeacher(id);
  else if (r === 'v') v = viewVisit(id);
  else if (r === 'fill') v = viewFill(id);
  else if (r === 'close') v = viewClose(id);
  else if (r === 'me') v = viewMe();
  else if (isDir()) v = viewDirector(['sup', 'tea', 'vis'].includes(r) ? r : 'sup');
  else if (isMain() && ['sup', 'tea', 'vis'].includes(r)) v = viewDirector(r);
  else v = r === 'visits' ? viewMyVisits() : viewSupervisor();
  const noNav = r === 'fill';
  $('#app').classList.add('shell');
  $('#app').innerHTML = `<div class="hero"><div class="wrap">${topbar()}${v.hero || ''}</div></div>
    <div class="panel"><div class="wrap ${anim}">${v.body}</div></div>${noNav ? '' : bottomNav(r)}${v.after || ''}`;
  setSync(Q.jobs.length ? 'busy' : (Q.state === 'offline' ? 'offline' : 'ok'));
  if (keep) window.scrollTo(0, y);
  if (v.mount) v.mount();
  animateGauges();
}
function topbar(){
  return `<div class="topbar"><div class="mark">${IC.book}</div>
    <div class="tb-t"><b>${esc(B().school.name || appName())}</b><small>${esc(B().cfg.season)} · ${esc(S.auth.role === 'مشرف' ? ASST : S.auth.role)}${isMain() ? ' رئيسي' : ''}</small></div>
    ${isCoord() ? `<button class="coord-b" data-act="mySchools">⇄ مدارسي (${(B().mySchools || []).length})</button>` : ''}
    <span class="sync"><i></i><span>محفوظ</span></span></div>`;
}
function bottomNav(r){
  const items = isTeacher() ? [['#/', '', 'دروسي', IC.book2], ['#/me', 'me', 'حسابي', IC.me]]
    : isDir()
    ? [['#/sup', 'sup', 'المساعدون', IC.shield], ['#/tea', 'tea', 'المعلمون', IC.users], ['#/vis', 'vis', 'الزيارات', IC.clip], ['#/prog', 'prog', 'السيرورة', IC.road], ['#/stats', 'stats', 'الإحصاءات', IC.chart], ['#/me', 'me', 'حسابي', IC.me]]
    : isMain()
    ? [['#/', '', 'معلميّ', IC.users], ['#/tea', 'team', 'الفريق', IC.shield], ['#/visits', 'visits', 'زياراتي', IC.clip], ['#/prog', 'prog', 'السيرورة', IC.road], ['#/stats', 'stats', 'الإحصاءات', IC.chart], ['#/me', 'me', 'حسابي', IC.me]]
    : [['#/', '', 'معلميّ', IC.users], ['#/visits', 'visits', 'الزيارات', IC.clip], ['#/prog', 'prog', 'السيرورة', IC.road], ['#/stats', 'stats', 'الإحصاءات', IC.chart], ['#/me', 'me', 'حسابي', IC.me]];
  let cur = ['t', 'v', 'close'].includes(r) ? (isDir() ? 'tea' : '') : (isDir() && r === '' ? 'sup' : r);
  if (isMain() && ['sup', 'tea', 'vis'].includes(r)) cur = 'team';
  if (r === 'cls') cur = isTeacher() ? '' : 'prog';
  const bd = navBadges();
  return `<nav class="bnav${items.length > 5 ? ' n6' : ''}">${items.map(([h, k, l, i]) => `<a href="${h}" class="${k === cur ? 'on' : ''}" style="position:relative">${i}<span>${l}</span>${bd[k] ? `<b class="badge">${bd[k]}</b>` : ''}</a>`).join('')}</nav>`;
}

/** الشارات الحمراء: للمعلم (لم يسجّل هذا الأسبوع + متأخر)، وللمساعد والمدير (مواد متأخرة) */
function navBadges(){
  const out = {};
  try{
    if (!PROG || PROG.ver !== B().progVer) return out;
    const map = logMap(), list = B().assignments || [];
    if (isTeacher()){
      const weekAgo = isoDate(new Date(Date.now() - 6 * 864e5));
      let n = list.length && !(B().lessonLog || []).some(x => x[4] === S.auth.user && x[3] >= weekAgo) ? 1 : 0;
      if (list.some(a => progressOf(a.level, a.group, a.subject, map).st === 'late')) n++;
      out[''] = n;
    } else {
      out.prog = activeAssignments().filter(a => progressOf(a.level, a.group, a.subject, map).st === 'late').length;
    }
    const total = Object.values(out).reduce((x, y) => x + y, 0);
    if (navigator.setAppBadge) (total ? navigator.setAppBadge(total) : navigator.clearAppBadge()).catch(() => {});
  } catch(e){}
  return out;
}

/* ============================== الدخول ============================== */
async function loadDir(force){
  const cached = LS.get('ishraf.dir');
  if (cached && !force) { S.L.dir = cached; api('start').then(d => { LS.set('ishraf.dir', d); if (JSON.stringify(d) !== JSON.stringify(S.L.dir)){ S.L.dir = d; if (!S.auth && !['pin', 'new1', 'new2'].includes(S.L.step)) renderLogin(); } }).catch(() => {}); return; }
  S.L.dir = await api('start');
  LS.set('ishraf.dir', S.L.dir);
}

async function renderLogin(){
  const L = S.L;
  const last = LS.get('ishraf.last') || {};
  if (!L.dir){
    $('#app').innerHTML = loginFrame('<div class="stack"><div class="sk" style="height:48px"></div><div class="sk" style="height:56px"></div><div class="sk" style="height:56px"></div><div class="sk" style="height:56px"></div></div>');
    try { await loadDir(); if (S.auth && S.B) return; }
    catch(e){ $('#app').innerHTML = loginFrame(`<div class="stack"><div class="banner">${esc(e.message)}</div><button class="btn btn-p btn-block" id="retry">إعادة المحاولة</button></div>`); $('#retry').onclick = () => renderLogin(); return; }
  }
  const schools = L.dir.schools;
  if (!L.step){
    if (last.school && schools.some(s => s.code === last.school)){ L.school = last.school; L.step = 'name'; }
    else L.step = 'school';
  }
  const school = schools.find(s => s.code === L.school);
  let body = '';

  if (L.step === 'school'){
    body = `<div class="lstep-h"><h2>اختر مدرستك</h2></div>
      <div class="search">${IC.search}<input id="ss" placeholder="ابحث عن مدرستك…" autocomplete="off"></div>
      <div class="school-list" id="sl"></div>`;
  } else if (L.step === 'name'){
    const rank = u => u.role === 'مدير' ? 0 : u.role === 'منسق تربوي' ? 0.5 : u.role === 'معلم' ? 2 : 1;
    const users = L.dir.users.filter(u => u.school === L.school).sort((a, b) => rank(a) - rank(b) || a.name.localeCompare(b.name, 'ar'));
    body = `<div class="lstep-h"><h2>من أنت؟</h2><button class="chip v" id="chSch" style="border:0">${esc(school ? school.name : '')} · تغيير</button></div>
      ${users.length ? `<div class="names">${users.map(u => `<button data-u="${esc(u.id)}"><span class="ini" style="${avGrad(u.name)}">${esc(initials(u.name))}</span><span>${esc(u.name)}</span><span class="role">${esc(u.role)}</span></button>`).join('')}</div>`
        : `<div class="banner">لا يوجد مستخدمون في هذه المدرسة بعد. اتصل بالإدارة العامة.</div>`}`;
  } else if (L.step === 'pin' || L.step === 'new1' || L.step === 'new2'){
    const u = L.dir.users.find(x => x.id === L.user) || L.userObj || {};
    const title = L.step === 'pin' ? 'أدخل رمزك' : L.step === 'new1' ? 'اختر رمزك الشخصي' : 'أعد كتابة الرمز للتأكيد';
    const sub = L.step === 'pin' ? '' : '<div class="banner v" style="margin-top:10px">هذا دخولك الأول. اختر رمزًا من 4 إلى 8 أرقام تحفظه.</div>';
    body = `<div class="pin-top"><span class="ini" style="${avGrad(u.name)}">${esc(initials(u.name))}</span><b class="d" style="font-size:17px">${esc(u.name || '')}</b><span class="muted small">${title}</span></div>${sub}
      <div class="dots" id="dots"></div>
      <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n => `<button data-k="${n}">${n}</button>`).join('')}
        <button data-k="del" class="ghost" aria-label="حذف">${IC.del}</button><button data-k="0">0</button><button data-k="ok" class="ok" aria-label="دخول">${IC.check}</button></div>
      <div class="row" style="justify-content:space-between;margin-top:14px"><button class="chip" id="backName" style="border:0">رجوع</button><span class="muted small">نسيت رمزك؟ اتصل بالإدارة العامة</span></div>`;
  }
  $('#app').innerHTML = loginFrame(body);

  if (L.step === 'school'){
    const draw = q => {
      const list = schools.filter(s => !q || s.name.includes(q));
      $('#sl').innerHTML = list.map(s => `<button data-s="${esc(s.code)}"><span class="ini" style="${avGrad(s.name)}">${esc(s.name.replace(/^(ابتدائية|متوسطة|دار)\s+/, '').trim()[0] || '')}</span><span>${esc(s.name)}</span></button>`).join('') || '<div class="muted small" style="text-align:center;padding:12px">لا نتائج</div>';
    };
    draw('');
    $('#ss').oninput = e => draw(e.target.value.trim());
    $('#sl').onclick = e => { const b = e.target.closest('[data-s]'); if (!b) return; buzz(); L.school = b.dataset.s; L.step = 'name'; renderLogin(); };
  }
  if (L.step === 'name'){
    $('#chSch').onclick = () => { L.step = 'school'; renderLogin(); };
    $$('.names [data-u]').forEach(b => b.onclick = () => { buzz(); L.user = b.dataset.u; L.step = 'pin'; L.code = ''; renderLogin(); });
  }
  if (['pin', 'new1', 'new2'].includes(L.step)){
    L.code = '';
    const dots = () => { $('#dots').innerHTML = Array.from({ length: Math.max(4, L.code.length) }, (_, i) => `<i class="${i < L.code.length ? 'on' : ''}"></i>`).join(''); };
    dots();
    const fail = msg => { const d = $('#dots'); d.classList.remove('shake'); void d.offsetWidth; d.classList.add('shake'); buzz([30, 50, 30]); L.code = ''; dots(); if (msg) toast(msg, true); };
    const submit = async () => {
      if (L.code.length < 4) return fail('الرمز من 4 أرقام على الأقل');
      const okBtn = $('.pad .ok');
      if (L.step === 'pin'){
        try{
          const t0 = performance.now();
          const r = await busy(okBtn, () => api('login', { auth: { school: L.school, user: L.user, code: L.code } }));
          if (r.boot) notePerf(r.boot, t0);
          S.auth = { school: L.school, user: L.user, code: L.code, name: r.user.name, role: r.user.role };
          LS.set('ishraf.last', { school: L.school, user: L.user });
          if (r.mustChange){ L.userObj = r.user; L.step = 'new1'; return renderLogin(); }
          finishLogin(r.boot);
        } catch(e){ fail(e.message); }
      } else if (L.step === 'new1'){
        if (L.code === S.auth.code) return fail('اختر رمزًا مختلفًا عن الرمز المؤقت');
        L.newCode = L.code; L.step = 'new2'; renderLogin();
      } else {
        if (L.code !== L.newCode){ L.step = 'new1'; renderLogin(); return toast('الرمزان غير متطابقين، أعد المحاولة', true); }
        try{
          const r = await busy(okBtn, () => api('changeCode', { newCode: L.code }));
          S.auth.code = L.code;
          toast('تم حفظ رمزك');
          finishLogin(r.boot);
        } catch(e){ fail(e.message); }
      }
    };
    const press = k => {
      if ($('.pad .ok.busy')) return;
      if (k === 'del'){ L.code = L.code.slice(0, -1); buzz(5); return dots(); }
      if (k === 'ok') return submit();
      if (L.code.length >= 8) return;
      L.code += k; buzz(5); dots();
    };
    $('.pad').onclick = e => { const b = e.target.closest('[data-k]'); if (b) press(b.dataset.k); };
    document.onkeydown = e => {
      if (!['pin', 'new1', 'new2'].includes(S.L.step) || S.auth && S.B) return;
      if (/^\d$/.test(e.key)) press(e.key); else if (e.key === 'Backspace') press('del'); else if (e.key === 'Enter') press('ok');
    };
    $('#backName').onclick = () => { if (L.step !== 'pin'){ S.auth = null; } L.step = 'name'; renderLogin(); };
  }
}
function loginFrame(body){
  document.title = appName();
  return `<div class="login"><div class="brandbig"><div class="mark">${IC.bookBig}</div><h1>${appName()}</h1></div>
    <div class="lcard enter-f">${body}</div></div>`;
}
function finishLogin(boot){
  document.onkeydown = null;
  LS.set('ishraf.auth', S.auth);
  S.B = boot; persist();
  S.L = { step: '', dir: S.L.dir };
  history.replaceState(null, '', location.pathname + '#/');
  S.lastRoute = null;
  render();
}

/* ============================== المشرف: الرئيسية ============================== */
function teacherCard(t){
  const vs = visitsOf(t.id);
  const done = vs.filter(v => v.status === 'مكتملة').length;
  const st = teacherState(t);
  const color = st === 'open' ? 'var(--amber)' : st === 'done' ? 'var(--ok)' : 'var(--v600)';
  const last = vs.filter(v => v.score !== null).pop();
  const chip = { open: '<span class="chip warn">زيارة مفتوحة</span>', done: '<span class="chip ok">اكتملت</span>', progress: `<span class="chip v">${done}/${t.planned}</span>`, none: '<span class="chip">لم تبدأ</span>' }[st];
  return `<div class="card tcard" data-go="#/t/${esc(t.id)}">${avatar(tName(t), t.planned ? done / t.planned : 0, color)}
    <div class="b"><h3>${esc(tName(t))}</h3>
      <div class="small muted">${esc(ROLE_LABEL[t.role] || '')} · ${esc(t.level || '—')}${t.experience === 0 ? ' · <span class="chip clay" style="padding:0 8px">جديد</span>' : ''}</div>
      <div class="row" style="margin-top:4px;gap:6px">${chip}${seeAll() && t.supervisor !== S.auth.user ? `<span class="small muted">${esc(t.supervisor ? userName(t.supervisor) : 'غير مسند')}</span>` : ''}</div></div>
    ${last ? `<span class="score-pill" style="background:${scoreColor(last.score)}22;color:${scoreColor(last.score)}">${last.score}</span>` : ''}</div>`;
}
function filterTeachers(list){
  const q = S.q.trim();
  return list.filter(t => (!q || tName(t).includes(q) || (t.level || '').includes(q)) &&
    (S.filter === 'all' || teacherState(t) === S.filter || (S.filter === 'none' && teacherState(t) === 'progress')));
}
function viewSupervisor(){
  const ts = B().teachers.filter(t => t.active && t.supervisor === S.auth.user);
  const planned = ts.reduce((a, t) => a + t.planned, 0);
  const mine = B().visits.filter(v => v.supervisor === S.auth.user);

  const open = mine.filter(v => v.status === 'مفتوحة').length;
  const first = S.auth.name.split(' ')[0];
  const list = filterTeachers(ts);

  return {
    hero: `<h1>مرحبًا، ${esc(first)}</h1><div class="sub">${done ? `أنجزت ${done} من ${planned} زيارة هذا الموسم` : 'لنبدأ زيارات هذا الموسم'}</div>
      <div class="kpis"><div class="kpi glass"><div class="n">${ts.length}</div><div class="l">معلم مسند</div></div>
        <div class="kpi glass"><div class="n">${done}<small> / ${planned}</small></div><div class="l">زيارة مكتملة</div></div>
        <div class="kpi glass accent"><div class="n">${open}</div><div class="l">مفتوحة الآن</div></div></div>`,
    body: `<div class="stack">
      <div class="spread"><div class="sec-t" style="margin:0">معلميّ</div>
        ${isMain() ? `<div class="row"><button class="btn btn-g" data-act="import">${IC.xls} استيراد</button><button class="btn btn-p" data-act="addTeacher">${IC.plus} معلم</button></div>` : ''}</div>
      <div class="search">${IC.search}<input id="q" placeholder="ابحث باسم المعلم أو المستوى" value="${esc(S.q)}"></div>
      <div class="tabs">${f('all', 'الكل')}${f('none', 'لم تكتمل')}${f('open', 'مفتوحة')}${f('done', 'مكتملة')}</div>
      ${list.length ? `<div class="grid g2">${list.map(teacherCard).join('')}</div>` : emptyBox(ts.length ? 'لا نتائج مطابقة' : isMain() ? 'لا يوجد معلمون مسندون إليك بعد.<br>أضف معلمًا أو استورد قائمة من إكسل، أو أسندهم من صفحة «الفريق».' : 'لا يوجد معلمون مسندون إليك بعد.<br>اطلب من المساعد البيداغوجي الرئيسي إسنادهم إليك.')}
      ${extra.length ? `<div class="sec-t" style="margin-top:22px">زيارات سابقة لمعلمين نُقلوا</div><div class="grid g2">${extra.map(teacherCard).join('')}</div>` : ''}
    </div>`,
    mount: bindSearch
  };

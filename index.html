          ? `<span class="s" style="background:${val !== undefined ? sHex(val) : '#CFC6E6'}">${val ?? '—'}</span>`
          : `<span class="c">${val ?? '—'}</span>`;
        return `<div class="rit"><span class="x">${esc(it.text)}</span>${mark}</div>`;

  const cats = uniq(cfg.trainings.map(x => x.category));

  $('#app').innerHTML = `<div class="rp-bar no-print"><button class="back" data-go="#/v/${esc(id)}">${IC.back} رجوع</button><span class="t">تقرير الزيارة ${ORD[v.number - 1] || v.number}</span>
      <button class="btn btn-w" data-act="print">${IC.print} طباعة / PDF</button></div>
    <div class="rp-stage" id="rpStage"><div class="rp-scale" id="rpS"><div class="a4" id="a4">
      <div class="rh">
        <div class="org"><b>${esc(B().school.name)}</b>الموسم الدراسي ${esc(cfg.season)}</div>
        <h1>تقرير الزيارة التربوية ${ORD[v.number - 1] || v.number}<small>${esc(tName(t))}</small></h1>
        <div class="lg"><span>الإشراف التربوي · ${esc(id)}<br>أُغلقت ${esc(fmtDate((v.closed || '').slice(0, 10)))}<br>طُبع ${esc(fmtDate(today))}</span><i>${IC.book}</i></div>
      </div>
      <div class="rinfo">
        <table><tr><td>المعلم</td><td>${esc(tName(t))}${t.father ? ' بن ' + esc(t.father) : ''}</td></tr>
          <tr><td>المستوى المدرَّس</td><td>${esc(t.level || '—')} · ${esc(t.type || '')}</td></tr>
          <tr><td>المستوى التعليمي</td><td>${esc(t.edu || '—')}</td></tr>
          <tr><td>سنوات الخبرة</td><td>${t.experience === '' ? '—' : t.experience}</td></tr>
          <tr><td>المشرف التربوي</td><td>${esc(sup)}</td></tr></table>
        <table><tr><td>تاريخ الزيارة</td><td>${esc(dates || '—')}</td></tr>
          <tr><td>التوقيت</td><td>${esc(times || '—')}</td></tr>

          <tr><td>عدد التلاميذ</td><td>${esc(pupils || '—')}</td></tr>
          <tr><td>الحصص الميدانية</td><td>${ss.length}</td></tr></table>
        <div class="rscore"><small>النقطة النهائية</small><b style="color:${scoreColor(score)}">${score ?? '—'}</b><small>من 100</small><span style="color:${scoreColor(score)}">${esc(grade)}</span></div>
      </div>
      <div class="rlegend">${range(cfg.min, cfg.max).map(n => `<span><i style="background:${sHex(n)}"></i>${n}</span>`).join('')}<span>· سلّم التقييم من ${cfg.min} إلى ${cfg.max}</span></div>
      <div class="rsecs">${secHtml}</div>
      <div class="rbox"><h5>ملاحظات المشرف التربوي</h5><div style="white-space:pre-wrap;min-height:7mm">${esc(v.notes) || '<span style="color:#A99CC6">—</span>'}</div></div>
      <div class="rbox"><h5>التكوينات المقترحة</h5>${trHtml}</div>
      <div class="rsign">
        <div><h5>المشرف التربوي</h5><div style="font-weight:600">${esc(sup)}</div><div class="small" style="color:#6E6488;font-size:7.5pt">التوقيع:</div><div class="lines"></div></div>
        <div><h5>ملاحظة المدير</h5><div class="lines"></div></div>

      </div>
      <div class="rbox" style="display:flex;gap:6mm;font-size:8pt;padding:1.5mm 2.8mm"><span>اطّلع عليه المعلم:</span><span style="flex:1;border-bottom:.2mm dotted #A99CC6"></span><span>التاريخ:</span><span style="width:28mm;border-bottom:.2mm dotted #A99CC6"></span></div>
    </div>${reportPage2(v, t, items, scores, c, secs)}</div></div>`;
  const fit = () => {

    st.style.height = (s.offsetHeight * k + 50) + 'px';
    st.style.overflow = 'hidden';
  };
  fit(); window.onresize = () => { if (route().r === 'report') fit(); };
  S.printTitle = `تقرير ${tName(t)} - الزيارة ${v.number}`;

}
/** الصفحة الثانية: المحاور بالأعمدة، البنود للمراجعة الذاتية، نقاط التميّز */
function reportPage2(v, t, items, scores, c, secs){
  const cfg = B().cfg;
  // الزيارة السابقة للمقارنة
  const prev = visitsOf(t.id).find(x => x.number === v.number - 1 && x.status === 'مكتملة');
  let pc = null;
  if (prev){ const ps = {}; items.forEach(it => { const x = valueOf(prev.id, it.id); if (x !== undefined) ps[it.id] = x; }); pc = computeScore(items, ps); }

  // نسب الأقسام
  const secTiles = secs.map(sec => {
    const vals = sec.axes.flatMap(a => a.its.filter(it => it.kind === 'علامة' && scores[it.id] !== undefined).map(it => scores[it.id]));
    if (!vals.length) return '';
    const p = pct100(vals.reduce((a, b) => a + b, 0) / vals.length);
    return `<div><b style="color:${scoreColor(p)}">${p}%</b><span>${esc(sec.name)}</span></div>`;
  }).join('');

  // أعمدة المحاور مرتبة من الأعلى
  const rows = cfg.axes.filter(ax => ax.coef > 0 && c.perAxis[ax.id] !== undefined)
    .map(ax => ({ ax, p: pct100(c.perAxis[ax.id]), pp: pc && pc.perAxis[ax.id] !== undefined ? pct100(pc.perAxis[ax.id]) : null }))
    .sort((a, b) => b.p - a.p);
  const chart = `<div class="axc">${rows.map((r, i) => {
    const delta = r.pp === null ? '' : r.p - r.pp;
    const dTxt = delta === '' ? '' : delta > 0 ? `<span style="color:#0E9F6E">▲ ${delta}</span>` : delta < 0 ? `<span style="color:#D9443A">▼ ${-delta}</span>` : '<span style="color:#A99CC6">＝</span>';
    return `<span class="l">${i < 3 ? '<i>★ </i>' : ''}${esc(r.ax.name)}</span>
      <div class="tr"><span class="grid50" style="inset-inline-start:50%"></span><div class="now" style="width:${Math.max(8, r.p)}%;background:${scoreColor(r.p)}">${r.p}%</div>${r.pp !== null ? `<div class="prev" style="width:${r.pp}%"></div>` : ''}</div>
      <span class="d">${dTxt}</span>`;
  }).join('')}</div>
  <div class="rlegend" style="justify-content:flex-start;margin-top:2mm"><span><i style="background:#E69138"></i>★ أعلى ثلاثة محاور</span>${pc ? `<span><i style="background:#4C1D95;opacity:.45;border-radius:1px;height:1.3mm"></i>الزيارة ${ORD[prev.number - 1] || prev.number} (${prev.score})</span><span>▲▼ الفرق بالنقاط</span>` : ''}</div>`;

  // بنود المراجعة الذاتية: 3 فأقل، وإن قلّت نكمل بأضعف العلامات 4
  const order = it => cfg.axes.findIndex(a => a.id === it.axis) * 100 + it.order;
  const scored = items.filter(it => it.kind === 'علامة' && scores[it.id] !== undefined).sort((a, b) => scores[a.id] - scores[b.id] || order(a) - order(b));
  const threshold = cfg.min + Math.round((cfg.max - cfg.min) / 2);
  let weak = scored.filter(it => scores[it.id] <= threshold);
  const onlyFour = !weak.length;
  if (weak.length < 4) weak = weak.concat(scored.filter(it => scores[it.id] > threshold && scores[it.id] < cfg.max).slice(0, 4 - weak.length));
  weak = weak.slice(0, 11);
  const strong = scored.filter(it => scores[it.id] === cfg.max).sort((a, b) => order(a) - order(b));

  const review = weak.length ? `<table class="rv ${weak.length <= 6 ? 'tall' : ''}"><thead><tr><th></th><th>البند</th><th>المحور</th><th>العلامة</th><th>ما سأعمل عليه</th></tr></thead><tbody>
    ${weak.map((it, i) => `<tr><td class="n">${i + 1}</td><td>${esc(it.text)}</td><td class="ax">${esc(axisOf(it.axis).name)}</td>
      <td><span class="s" style="display:inline-grid;place-items:center;width:5mm;height:5mm;border-radius:50%;color:#fff;font-family:Changa;font-weight:700;background:${sHex(scores[it.id])}">${scores[it.id]}</span></td><td class="w"></td></tr>`).join('')}</tbody></table>`
    : '<div style="padding:3mm;background:#DDF6EC;border-radius:2mm;color:#0B7A55;font-family:Changa">كل البنود نالت العلامة الكاملة — أداء متميز</div>';

  return `<div class="a4">
    <div class="p2h"><div><h2>تحليل نتائج الزيارة ${ORD[v.number - 1] || v.number}<small>${esc(tName(t))} · ${esc(B().school.name)} · ${esc(cfg.season)}</small></h2></div>
      <div class="badge"><small style="font-size:7pt;color:#6E6488">النقطة</small><b style="color:${scoreColor(v.score)}">${v.score ?? '—'}</b><span style="font-size:8.5pt;color:${scoreColor(v.score)}">${esc(v.grade || '')}</span></div></div>
    <div class="p2secs">${secTiles}</div>
    <div class="p2t">المحاور من الأعلى إلى الأدنى<small>النسبة من 100${pc ? ' · مقارنة بالزيارة السابقة' : ''}</small></div>
    ${chart}
    <div class="p2t">بنود يُراجع فيها المعلم نفسه<small>${onlyFour ? 'لا توجد علامات ضعيفة؛ هذه أدنى البنود للتحسين' : `العلامات ${threshold} فأقل، من الأضعف`}</small></div>
    ${review}
    ${strong.length ? `<div class="p2t">نقاط التميّز<small>البنود التي نالت ${cfg.max} من ${cfg.max}</small></div><div class="strong">${strong.slice(0, 16).map(it => `<span>${esc(it.text)}</span>`).join('')}${strong.length > 16 ? `<span>+${strong.length - 16}</span>` : ''}</div>` : ''}
  </div>`;
}

/* ============================== لوحة الإحصاءات ============================== */
function hbars(rows, unit){
  if (!rows.length) return '<div class="muted small">لا توجد بيانات بعد</div>';
  const max = Math.max(...rows.map(r => r.max ?? r.value), 1);
  return `<div class="hb">${rows.map(r => `<span class="lab" title="${esc(r.label)}">${esc(r.label)}</span>
    <div class="trk"><i style="width:${Math.max(2, r.value / (r.max ?? max) * 100)}%;background:${r.color || 'var(--v600)'}"></i></div>
    <span class="v">${r.text ?? r.value}${unit || ''}</span>`).join('')}</div>`;
}
function donut(segs, center, sub){
  const tot = segs.reduce((a, s) => a + s.value, 0);
  const R = 52, C = 2 * Math.PI * R;
  let off = 0;
  const arcs = tot ? segs.filter(s => s.value).map(s => { const len = s.value / tot * C; const el = `<circle cx="70" cy="70" r="${R}" fill="none" stroke="${s.color}" stroke-width="20" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-off}"/>`; off += len; return el; }).join('') : '';
  return `<div class="donut"><svg width="140" height="140" viewBox="0 0 140 140"><g transform="rotate(-90 70 70)"><circle cx="70" cy="70" r="${R}" fill="none" stroke="var(--soft)" stroke-width="20"/>${arcs}</g>
      <text x="70" y="72" text-anchor="middle" style="font-family:Changa;font-size:24px;font-weight:700;fill:var(--ink)">${center}</text><text x="70" y="92" text-anchor="middle" style="font-size:11px;fill:var(--muted)">${sub || ''}</text></svg>
    <div class="leg" style="flex-direction:column;margin:0">${segs.map(s => `<span><i style="background:${s.color}"></i>${esc(s.label)} · <b>${s.value}</b>${tot ? ` (${Math.round(s.value / tot * 100)}%)` : ''}</span>`).join('')}</div></div>`;
}
const VCOL = ['#C4B5FD', '#7C3AED', '#E69138', '#0E9F6E', '#DB2777', '#2563EB'];

function viewStats(){
  const cfg = B().cfg, dir = isDir();
  const ts = B().teachers.filter(t => t.active);
  const tIds = new Set(ts.map(t => t.id));
  const vs = B().visits.filter(v => dir || v.supervisor === S.auth.user || tIds.has(v.teacher));
  const maxN = Math.max(1, ...vs.map(v => v.number), ...ts.map(t => t.planned));
  const vf = S.statVisit || 'all';
  const done = vs.filter(v => v.status === 'مكتملة');
  const doneF = vf === 'all' ? done : done.filter(v => v.number === Number(vf));
  const open = vs.filter(v => v.status === 'مفتوحة').length;
  const planned = ts.reduce((a, t) => a + t.planned, 0);
  const withY = ts.filter(t => t.experience !== '');
  const newT = ts.filter(t => t.experience === 0).length;
  const avgExp = withY.length ? Math.round(withY.reduce((a, t) => a + t.experience, 0) / withY.length * 10) / 10 : null;
  const avgScore = doneF.length ? Math.round(doneF.reduce((a, v) => a + (v.score || 0), 0) / doneF.length * 10) / 10 : null;
  const scoresOf = v => { const t = teacher(v.teacher); const o = {}; itemsFor(t ? t.type : '').forEach(it => { const x = valueOf(v.id, it.id); if (x !== undefined) o[it.id] = x; }); return o; };

  // التقديرات
  const grades = cfg.scale.slice().reverse();
  const gcol = ['#13A26C', '#7BBF4E', '#E8B730', '#F08A3E', '#E5484D'];
  const gSegs = grades.map((g, i) => ({ label: g.label, value: doneF.filter(v => v.grade === g.label).length, color: gcol[i] || '#999' }));

  // أداء المعلمين
  const perf = ts.map(t => ({ t, vs: visitsOf(t.id).filter(v => v.status === 'مكتملة') })).filter(x => x.vs.length)
    .sort((a, b) => (b.vs[b.vs.length - 1].score || 0) - (a.vs[a.vs.length - 1].score || 0));

  // المحاور
  const axAgg = {};
  doneF.forEach(v => {
    const t = teacher(v.teacher); const c = computeScore(itemsFor(t ? t.type : ''), scoresOf(v));
    Object.entries(c.perAxis).forEach(([k, a]) => { (axAgg[k] = axAgg[k] || []).push(a); });
  });
  const axRows = cfg.axes.filter(ax => ax.coef > 0 && axAgg[ax.id]).map(ax => {
    const p = pct100(axAgg[ax.id].reduce((a, b) => a + b, 0) / axAgg[ax.id].length);
    return { label: ax.name, value: p, max: 100, text: p, color: scoreColor(p) };
  }).sort((a, b) => a.value - b.value);

  // الانضباط
  const cnt = re => cfg.items.filter(it => it.kind !== 'علامة' && re.test(it.text)).map(it => it.id);
  const idS = cnt(/الحصص/), idA = cnt(/الغياب/), idL = cnt(/التأخر/);
  const sum = ids => doneF.reduce((a, v) => a + ids.reduce((b, id) => b + (Number(valueOf(v.id, id)) || 0), 0), 0);
  const nS = sum(idS), nA = sum(idA), nL = sum(idL);
  const rA = nS ? Math.round(nA / nS * 1000) / 10 : 0, rL = nS ? Math.round(nL / nS * 1000) / 10 : 0;

  // المعلمون
  const countBy = (list, key, order) => { const m = {}; list.forEach(t => { const k = t[key] || 'غير محدد'; m[k] = (m[k] || 0) + 1; }); return (order || []).concat(Object.keys(m).filter(k => !(order || []).includes(k))).filter(k => m[k]).map(k => ({ label: k, value: m[k] })); };
  const eduRows = countBy(ts, 'edu', cfg.lists['المستوى التعليمي']).map(r => Object.assign(r, { color: 'var(--v500)' }));
  const male = ts.filter(t => t.gender === 'ذكر').length, female = ts.filter(t => t.gender === 'أنثى').length, unk = ts.length - male - female;
  const lvl = {};
  withY.forEach(t => { const k = t.level || 'غير محدد'; (lvl[k] = lvl[k] || []).push(t.experience); });
  const expRows = (cfg.lists['المستويات المدرَّسة'] || []).concat(Object.keys(lvl)).filter((k, i, a) => lvl[k] && a.indexOf(k) === i)
    .map(k => { const a = Math.round(lvl[k].reduce((x, y) => x + y, 0) / lvl[k].length * 10) / 10; return { label: k, value: a, text: a, color: 'var(--amber)' }; });

  // التواريخ
  const ssAll = B().sessions.filter(s => vs.some(v => v.id === s.visit) && s.date).sort((a, b) => a.date.localeCompare(b.date));
  const first = ssAll[0], last = ssAll[ssAll.length - 1];
  const span = first ? Math.round((new Date(last.date) - new Date(first.date)) / 864e5) : null;
  const mins = ssAll.filter(s => s.from && s.to).map(s => { const [a, b] = s.from.split(':').map(Number), [c, d] = s.to.split(':').map(Number); return (c * 60 + d) - (a * 60 + b); }).filter(x => x > 0);
  const avgMin = mins.length ? Math.round(mins.reduce((a, b) => a + b, 0) / mins.length) : null;

  // التكوينات
  const trCount = {}; doneF.forEach(v => v.trainings.forEach(id => trCount[id] = (trCount[id] || 0) + 1));
  const trRows = cfg.trainings.filter(x => trCount[x.id]).map(x => ({ label: x.name, value: trCount[x.id], color: 'var(--clay)' })).sort((a, b) => b.value - a.value);

  const remaining = Math.max(0, planned - done.length - open);
  const seg = `<div class="seg no-print">${[['all', 'كل الزيارات']].concat(range(1, maxN).map(n => [String(n), 'الزيارة ' + (ORD[n - 1] || n)])).map(([k, l]) => `<button data-sv="${k}" class="${String(vf) === k ? 'on' : ''}">${l}</button>`).join('')}</div>`;
  const noData = '<div class="muted small">لا توجد زيارات مكتملة بعد</div>';

  const cards = [
    `<div class="dcard wide"><h4>تقدم الزيارات <small>${done.length} مكتملة · ${open} مفتوحة · ${remaining} متبقية من ${planned}</small></h4>
      <div class="stackbar"><i style="width:${planned ? done.length / planned * 100 : 0}%;background:var(--ok)"></i><i style="width:${planned ? open / planned * 100 : 0}%;background:var(--amber)"></i></div>
      <div class="leg"><span><i style="background:var(--ok)"></i>مكتملة</span><span><i style="background:var(--amber)"></i>مفتوحة</span><span><i style="background:var(--soft);border:1px solid var(--line)"></i>متبقية</span></div></div>`,
    `<div class="dcard"><h4>توزيع التقديرات</h4>${doneF.length ? donut(gSegs, avgScore ?? '—', 'متوسط النقطة') : noData}</div>`,
    `<div class="dcard"><h4>الانضباط <small>من ${nS} حصة مسجلة</small></h4>${nS ? `<div class="rings">
        <div><div class="mini-ring">${ring(rA / 100, '#E5484D', 92, 9)}<b>${rA}%</b></div><span class="small muted">نسبة الغيابات</span></div>
        <div><div class="mini-ring">${ring(rL / 100, '#F08A3E', 92, 9)}<b>${rL}%</b></div><span class="small muted">نسبة التأخرات</span></div></div>` : noData}</div>`,
    `<div class="dcard wide"><h4>أداء المعلمين <small>النقطة من 100 في كل زيارة</small></h4>${perf.length ? `<div class="gb">${perf.map(({ t, vs }) => `<div class="r"><span class="lab" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(tName(t))}</span><div class="bars">${vs.map(v => `<div><i style="width:${Math.max(2, v.score || 0)}%;background:${VCOL[v.number - 1] || '#999'}"></i><span>${v.score ?? '—'}</span></div>`).join('')}</div></div>`).join('')}</div>
      <div class="leg">${range(1, Math.max(...perf.map(p => p.vs.length))).map(n => `<span><i style="background:${VCOL[n - 1]}"></i>الزيارة ${ORD[n - 1] || n}</span>`).join('')}</div>` : noData}</div>`,
    `<div class="dcard"><h4>المحاور <small>من الأضعف إلى الأقوى (%)</small></h4>${axRows.length ? hbars(axRows) : noData}</div>`,
    `<div class="dcard"><h4>التكوينات الأكثر اقتراحًا</h4>${trRows.length ? hbars(trRows) : '<div class="muted small">لم تُقترح تكوينات بعد</div>'}</div>`,
    `<div class="dcard"><h4>المعلمون حسب المستوى التعليمي</h4>${hbars(eduRows)}</div>`,
    `<div class="dcard"><h4>متوسط الخبرة حسب المستوى المدرَّس <small>بالسنوات</small></h4>${expRows.length ? hbars(expRows) : '<div class="muted small">أضف سنة بداية العمل للمعلمين لتظهر الخبرة</div>'}</div>`,
    `<div class="dcard"><h4>الجنس</h4><div class="stackbar"><i style="width:${ts.length ? male / ts.length * 100 : 0}%;background:#2563EB"></i><i style="width:${ts.length ? female / ts.length * 100 : 0}%;background:#DB2777"></i></div>
      <div class="leg"><span><i style="background:#2563EB"></i>ذكور · ${male}</span><span><i style="background:#DB2777"></i>إناث · ${female}</span>${unk ? `<span><i style="background:var(--soft);border:1px solid var(--line)"></i>غير محدد · ${unk}</span>` : ''}</div></div>`,
    `<div class="dcard"><h4>المواعيد</h4><div class="facts">
      <div class="fact"><b>${first ? esc(fmtDate(first.date)) : '—'}</b><span>أول زيارة ميدانية</span></div>
      <div class="fact"><b>${last ? esc(fmtDate(last.date)) : '—'}</b><span>آخر زيارة ميدانية</span></div>
      <div class="fact"><b>${span ?? '—'}${span !== null ? ' يوم' : ''}</b><span>مدة الزيارات</span></div>
      <div class="fact"><b>${avgMin ?? '—'}${avgMin !== null ? ' د' : ''}</b><span>متوسط زمن الحصة</span></div></div></div>`
  ];
  if (dir){
    const sups = B().users.filter(u => u.role === 'مشرف' && u.active);
    const rows = sups.map(u => { const pl = ts.filter(t => t.supervisor === u.id).reduce((a, t) => a + t.planned, 0); const dn = done.filter(v => v.supervisor === u.id).length; return { label: u.name, value: dn, max: Math.max(pl, 1), text: `${dn}/${pl}`, color: 'var(--v600)' }; });
    cards.splice(1, 0, `<div class="dcard wide"><h4>تقدم المشرفين <small>زيارات مكتملة من المقررة</small></h4>${hbars(rows)}</div>`);
  }
  return {
    hero: `<div class="spread" style="margin-top:18px"><h1 style="margin:0">الإحصاءات</h1><button class="back no-print" data-act="print">${IC.print} طباعة</button></div>
      <div class="sub">${esc(B().school.name)} · ${esc(cfg.season)}${dir ? '' : ' · زياراتي ومعلميّ'}</div>
      <div class="kpis" style="grid-template-columns:repeat(auto-fit,minmax(100px,1fr))">
        <div class="kpi glass"><div class="n">${ts.length}</div><div class="l">معلم</div></div>
        <div class="kpi glass"><div class="n">${ts.length ? Math.round(newT / ts.length * 100) : 0}<small>%</small></div><div class="l">معلمون جدد (${newT})</div></div>
        <div class="kpi glass"><div class="n">${avgExp ?? '—'}</div><div class="l">متوسط الخبرة</div></div>
        <div class="kpi glass"><div class="n">${done.length}<small> / ${planned}</small></div><div class="l">زيارة مكتملة</div></div>
        <div class="kpi glass accent"><div class="n">${avgScore ?? '—'}</div><div class="l">متوسط النقطة</div></div></div>`,
    body: `<div class="stack">${seg}<div class="dash">${cards.join('')}</div></div>`,
    mount(){ $$('[data-sv]').forEach(b => b.onclick = () => { S.statVisit = b.dataset.sv; render(true); }); }
  };
}

/* ============================== الإجراءات ============================== */
const ACT = {
  print: () => { buzz(); window.print(); },
  sync: async el => { await busy(el, refreshBg); toast('تم التحديث'); },
  logout: async () => { if (Q.jobs.length) return toast('انتظر حتى يكتمل الحفظ', true); if (await confirmBox('الخروج', 'هل تريد الخروج من حسابك على هذا الجهاز؟', 'خروج')) logout(); },
  install: async () => { if (installEvt){ installEvt.prompt(); installEvt = null; } else toast('افتح قائمة المتصفح واختر «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية»'); },
  copy: el => { try { navigator.clipboard.writeText(el.dataset.t); toast('نُسخ الرمز'); } catch(e){} },
  filter: el => { S.filter = el.dataset.k; render(true); },
  toggleKanban: () => { S.kanban = !S.kanban; LS.set('ishraf.kanban', S.kanban); render(true); },
  addTeacher: () => teacherSheet({ supervisor: '' }),
  editTeacher: el => teacherSheet(Object.assign({}, teacher(el.dataset.id))),
  import: () => openImport(),
  assignSheet: el => assignSheet(el.dataset.id),

  startVisit: async el => {
    const t = teacher(el.dataset.id);
    const v = await busy(el, () => api('createVisit', { teacherId: t.id }));
    B().visits.push(v); persist(); buzz(15);
    go('#/v/' + v.id);
    setTimeout(() => sessionSheet(v.id), 80);
  },
  addSession: el => sessionSheet(el.dataset.v),
  editSession: el => sessionSheet(el.dataset.v, B().sessions.find(x => x.id === el.dataset.id)),
  pickSessSheet: el => {
    const vid = el.dataset.v;
    flushScores(vid);
    sheet(`<h3>تُنسب العلامات إلى أي حصة؟</h3><div class="stack">${sessionsOf(vid).map(s => `<button class="slot click" data-s="${esc(s.id)}" style="width:100%;text-align:start;${s.id === S.fillSession[vid] ? 'border-color:var(--v600);background:var(--v50)' : ''}"><div class="n">ح${s.number}</div><div class="b"><b class="d">${esc(s.subject || 'حصة')}</b><div class="small muted">${esc(fmtDate(s.date))}</div></div></button>`).join('')}
      <button class="btn btn-a" id="nsess">${IC.plus} حصة جديدة</button></div>`,
    (m, close) => {
      m.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { S.fillSession[vid] = b.dataset.s; close(); render(true); });
      m.querySelector('#nsess').onclick = () => { close(); sessionSheet(vid); };
    });
  },
  fmode: el => { S.fmode = el.dataset.k; LS.set('ishraf.fmode', S.fmode); render(true); },
  pick: el => {
    const vid = el.dataset.v, it = el.dataset.it, n = Number(el.dataset.n);
    setScore(vid, it, n); buzz(8);
    const row = el.closest('.item');
    row.querySelectorAll('.sv').forEach(b => b.classList.toggle('on', Number(b.dataset.n) === n));
    row.classList.remove('miss');
    updateFillBar(vid);
  },
  fPick: el => {
    const vid = route().id, items = fillItems(vid), i = S.fidx[vid];
    const n = Number(el.dataset.n);
    setScore(vid, items[i].id, n); buzz(12);
    el.parentElement.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === el));
    updateFillBar(vid);
    setTimeout(() => { if (route().r === 'fill' && S.fidx[vid] === i) fGo(vid, i + 1); }, 260);
  },
  fStep: el => { const i = $('#fNum'); i.value = Math.max(0, (Number(i.value) || 0) + Number(el.dataset.d)); buzz(5); },
  fNumOk: () => {
    const vid = route().id, items = fillItems(vid), i = S.fidx[vid];
    const raw = $('#fNum').value.trim();
    if (!/^\d+$/.test(raw)) return toast('اكتب عددًا صحيحًا', true);
    setScore(vid, items[i].id, Number(raw)); buzz(12); fGo(vid, i + 1);
  },
  fGo: el => fGo(route().id, Number(el.dataset.i)),
  fNextMissing: () => { const vid = route().id; const items = fillItems(vid); const i = items.findIndex(it => valueOf(vid, it.id) === undefined); fGo(vid, i < 0 ? items.length : i); },
  fAxes: () => {
    const vid = route().id, items = fillItems(vid);
    let last = '';
    sheet(`<h3>انتقل إلى محور</h3><div class="stack">${B().cfg.axes.filter(ax => items.some(it => it.axis === ax.id)).map(ax => {
      const its = items.filter(it => it.axis === ax.id); const f = its.filter(it => valueOf(vid, it.id) !== undefined).length;
      const head = ax.section !== last ? `<div class="small muted d" style="margin-top:6px">${esc(last = ax.section)}</div>` : '';
      return head + `<button class="slot click" data-ax="${esc(ax.id)}" style="width:100%;text-align:start"><div class="b"><b class="d">${esc(ax.name)}</b></div><span class="chip ${f === its.length ? 'ok' : ''}">${f}/${its.length}</span></button>`;
    }).join('')}</div>`, (m, close) => m.querySelectorAll('[data-ax]').forEach(b => b.onclick = () => {
      close(); const its = items.map((it, k) => [it, k]).filter(([it]) => it.axis === b.dataset.ax);
      const miss = its.find(([it]) => valueOf(vid, it.id) === undefined); fGo(vid, (miss || its[0])[1]);
    }));
  },
  closeVisit: async el => {
    const vid = el.dataset.v;
    if (Object.keys(getDraft(vid)).length || Q.jobs.length){
      flushScores(vid);
      await busy(el, drain);
      if (Object.keys(getDraft(vid)).length) return toast('لم يكتمل حفظ العلامات، تحقق من الاتصال', true);
    }
    if (!await confirmBox('إغلاق الزيارة', 'بعد الإغلاق تُحسب النقطة النهائية ولا يمكن تعديل العلامات. هل تؤكد؟', 'إغلاق نهائي', 'btn-ok')) return;
    const nd = LS.get('ishraf.close.' + vid) || {};
    try{
      const v = await busy(el, () => api('closeVisit', { visitId: vid, notes: ($('#notes') || {}).value ?? nd.notes ?? '', trainings: $$('[data-tr].on').map(x => x.dataset.tr) }));
      const i = B().visits.findIndex(x => x.id === vid); B().visits[i] = v;
      LS.del('ishraf.close.' + vid); persist(); buzz([15, 60, 15]);
      go('#/v/' + vid);
    } catch(e){ toast(e.message, true); }
  },

  addSup: () => sheet(`<h3>مشرف جديد</h3><div class="stack">
      <label class="field"><span>الاسم واللقب *</span><input id="uName" autocomplete="off"></label>
      <label class="field"><span>الهاتف</span><input id="uPhone" inputmode="tel" dir="ltr" style="text-align:right"></label></div>
      <div class="acts"><button class="btn btn-g" data-close>إلغاء</button><button class="btn btn-p" id="svU">إضافة</button></div>`,
    (m, close) => m.querySelector('#svU').onclick = async e => {
      const name = m.querySelector('#uName').value.trim();
      if (name.length < 3) return toast('اكتب اسم المشرف ولقبه', true);
      try{
        const u = await busy(e.currentTarget, () => api('addSupervisor', { name, phone: m.querySelector('#uPhone').value.trim() }));
        B().users.push(u); persist(); close(); render(true); buzz(15);
        sheet(`<div style="text-align:center"><div class="pin-top"><span class="ini" style="${avGrad(u.name)}">${esc(initials(u.name))}</span></div>
          <h3 style="margin:10px 0 4px">أُضيف ${esc(u.name)}</h3><p class="muted small" style="margin:0 0 14px">سلّمه رمز التفعيل. سيدخل به أول مرة ثم يختار رمزه الشخصي.</p>
          <div class="code-big">${esc(u.tempCode)}</div></div>
          <div class="acts"><button class="btn btn-g" data-act="copy" data-t="${esc(u.tempCode)}" onclick="ACT.copy(this)">نسخ</button><button class="btn btn-p" data-close>تم</button></div>`);
      } catch(err){ toast(err.message, true); }
    }),
  supActive: async el => {
    const u = user(el.dataset.id), on = !u.active;
    if (!on && !await confirmBox('إيقاف المشرف', `إيقاف ${esc(u.name)}؟ لن يستطيع الدخول، وتبقى زياراته محفوظة.`, 'إيقاف')) return;
    u.active = on; render(true); persist();
    enqueue({ action: 'setUserActive', payload: { userId: u.id, active: on }, onFail: () => { u.active = !on; render(true); } });
  }
};
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-go],[data-act]');
  if (!el || el.closest('.sheet') && !el.dataset.act) return;
  if (el.dataset.go !== undefined){ buzz(4); return go(el.dataset.go); }
  const fn = ACT[el.dataset.act];
  if (fn && !el.closest('.sheet[data-own]')){ e.preventDefault(); try { await fn(el); } catch(err){ toast(err.message, true); } }
});

/* ===== السحب للتحديث ===== */
(() => {
  let y0 = null, dy = 0;
  const ptr = $('#ptr');
  addEventListener('touchstart', e => { if (scrollY <= 0 && S.B && !$('.sheet-bg') && !['fill'].includes(route().r)) y0 = e.touches[0].clientY; else y0 = null; }, { passive: true });
  addEventListener('touchmove', e => { if (y0 === null) return; dy = Math.max(0, e.touches[0].clientY - y0); ptr.style.transform = `translateY(${Math.min(dy, 110) - 70}px) rotate(${dy * 2}deg)`; }, { passive: true });
  addEventListener('touchend', async () => {
    if (y0 === null) return; y0 = null;
    if (dy > 90){ ptr.classList.add('go'); ptr.style.transform = 'translateY(20px)'; await refreshBg(); ptr.classList.remove('go'); toast('تم التحديث'); }
    ptr.style.transform = ''; dy = 0;
  });
})();

if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
boot();
</script>
</body>
</html>

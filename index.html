<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5B21B6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>الإشراف التربوي</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Changa:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --v950:#1E0B3A; --v900:#2E1065; --v800:#4C1D95; --v700:#5B21B6; --v600:#7C3AED; --v500:#8B5CF6; --v400:#A78BFA; --v300:#C4B5FD; --v100:#EDE9FE; --v50:#F5F3FF;
  --clay:#A0522D; --clay-l:#F6E6DA; --amber:#E69138; --amber-l:#FDF0DF;
  --paper:#F7F5FC; --card:#FFFFFF; --ink:#1E1433; --muted:#6E6488; --line:#E7E2F3; --soft:#F1EDFA;
  --ok:#0E9F6E; --ok-l:#DDF6EC; --warn:#C47A12; --warn-l:#FDF0DF; --bad:#D9443A; --bad-l:#FDE6E4;
  --s1:#E5484D; --s2:#F08A3E; --s3:#E8B730; --s4:#7BBF4E; --s5:#13A26C;
  --sh:0 1px 2px rgba(46,16,101,.06),0 8px 24px rgba(46,16,101,.08);
  --sh-lg:0 20px 60px rgba(30,11,58,.28);
  --r:20px;
  --bg:linear-gradient(155deg,#3B0F7A 0%,#6D28D9 38%,#8B5CF6 70%,#B07CF7 100%);
  --nav-h:68px;
}
:root[data-theme="dark"]{
  --paper:#140A24; --card:#1F1433; --ink:#F1ECFB; --muted:#A99CC6; --line:#30244A; --soft:#271B3E;
  --v50:#241640; --v100:#2E1D52; --clay-l:#3A2418; --amber-l:#3A2A14; --ok-l:#12352A; --warn-l:#3A2A14; --bad-l:#3D1A1A;
  --sh:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3);
  --bg:linear-gradient(155deg,#1A0638 0%,#3B0F7A 45%,#5B21B6 100%);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme]){
    --paper:#140A24; --card:#1F1433; --ink:#F1ECFB; --muted:#A99CC6; --line:#30244A; --soft:#271B3E;
    --v50:#241640; --v100:#2E1D52; --clay-l:#3A2418; --amber-l:#3A2A14; --ok-l:#12352A; --warn-l:#3A2A14; --bad-l:#3D1A1A;
    --sh:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3);
    --bg:linear-gradient(155deg,#1A0638 0%,#3B0F7A 45%,#5B21B6 100%);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--v700);background-image:var(--bg);background-attachment:fixed;color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;font-size:15.5px;line-height:1.65;overscroll-behavior-y:contain}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:
  radial-gradient(600px 400px at 85% -5%,rgba(255,255,255,.18),transparent 60%),
  radial-gradient(500px 500px at -10% 30%,rgba(230,145,56,.16),transparent 60%);z-index:0}
h1,h2,h3,h4,.d,button,select,input,label,.chip{font-family:"Changa",sans-serif}
h1,h2,h3,h4{margin:0;line-height:1.3}
button{cursor:pointer;color:inherit}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px;position:relative;z-index:1}
.hide{display:none!important}

/* ===== البطل والشريط ===== */
.hero{color:#fff;padding:calc(10px + env(safe-area-inset-top)) 0 54px;position:relative;z-index:1}
.topbar{display:flex;align-items:center;gap:10px;min-height:52px}
.mark{width:40px;height:40px;border-radius:13px;background:linear-gradient(140deg,#B8693F,var(--clay));display:grid;place-items:center;box-shadow:0 6px 16px rgba(160,82,45,.45),inset 0 1px 0 rgba(255,255,255,.25);flex:none}
.tb-t{flex:1;min-width:0}
.tb-t b{display:block;font-family:Changa;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-t small{display:block;font-size:12.5px;opacity:.78;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.14);font-family:Changa;font-size:12.5px;backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.18);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:#5EEAD4;box-shadow:0 0 0 3px rgba(94,234,212,.25)}
.sync.busy i{background:#FDE68A;animation:pulse 1s infinite}
.sync.offline i{background:#FCA5A5}
@keyframes pulse{50%{opacity:.35}}
.hero h1{font-size:27px;font-weight:700;margin-top:18px;letter-spacing:-.2px}
.hero .sub{opacity:.82;font-size:14px;margin-top:2px}
.glass{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:18px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.kpi{padding:12px 14px}
.kpi .n{font-family:Changa;font-size:26px;font-weight:700;line-height:1.1}
.kpi .n small{font-size:14px;opacity:.7;font-weight:500}
.kpi .l{font-size:12.5px;opacity:.85}
.kpi.accent{background:linear-gradient(140deg,rgba(230,145,56,.38),rgba(230,145,56,.16));border-color:rgba(253,215,170,.4)}

/* ===== اللوحة ===== */
.panel{background:var(--paper);border-radius:30px 30px 0 0;margin-top:-34px;min-height:60vh;position:relative;z-index:2;padding:22px 0 calc(var(--nav-h) + 40px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(30,11,58,.18)}
.enter-f{animation:inF .32s cubic-bezier(.2,.8,.2,1)}
.enter-b{animation:inB .32s cubic-bezier(.2,.8,.2,1)}
@keyframes inF{from{opacity:0;transform:translateX(-26px)}}
@keyframes inB{from{opacity:0;transform:translateX(26px)}}
.stack>*+*{margin-top:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:13px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px}
.sec-t{font-family:Changa;font-weight:600;font-size:17px;display:flex;align-items:center;gap:8px;margin:6px 2px 10px}
.sec-t:before{content:"";width:5px;height:18px;border-radius:3px;background:linear-gradient(var(--amber),var(--clay))}
.back{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:12px;height:38px;padding:0 12px;font-size:14px;backdrop-filter:blur(8px)}

/* ===== أزرار ===== */
.btn{border:0;border-radius:14px;padding:11px 18px;font-size:15px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;transition:transform .12s,filter .2s,box-shadow .2s;position:relative}
.btn:active{transform:scale(.97)}
.btn-p{background:linear-gradient(140deg,var(--v500),var(--v700));color:#fff;box-shadow:0 8px 20px rgba(91,33,182,.32)}
.btn-p:hover{filter:brightness(1.07)}
.btn-a{background:linear-gradient(140deg,#F2A65A,var(--amber));color:#3A1F06;box-shadow:0 8px 18px rgba(230,145,56,.3)}
.btn-ok{background:linear-gradient(140deg,#1FC08A,var(--ok));color:#fff;box-shadow:0 8px 18px rgba(14,159,110,.3)}
.btn-g{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.btn-w{background:#fff;color:var(--v700)}
.btn[disabled]{opacity:.45;pointer-events:none;box-shadow:none}
.btn.busy{color:transparent!important;pointer-events:none}
.btn.busy:after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;animation:sp .7s linear infinite}
.btn-g.busy:after{border-color:var(--line);border-top-color:var(--v600)}
.btn-block{width:100%}
.ibtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;flex:none}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 11px;font-size:12.5px;font-weight:500;background:var(--soft);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-l);color:var(--ok)}
.chip.warn{background:var(--warn-l);color:var(--warn)}
.chip.bad{background:var(--bad-l);color:var(--bad)}
.chip.v{background:var(--v100);color:var(--v700)}
:root[data-theme="dark"] .chip.v{color:var(--v300)}
.chip.clay{background:var(--clay-l);color:var(--clay)}

/* ===== إدخال ===== */
.field{display:block}
.field>span{display:block;font-size:13.5px;font-weight:500;margin-bottom:6px;color:var(--muted);font-family:Changa}
input,select,textarea{width:100%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:11px 13px;font-size:16px;min-height:48px;outline:none;font-family:"IBM Plex Sans Arabic",sans-serif;transition:border-color .15s,box-shadow .15s}
textarea{min-height:120px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--v500);box-shadow:0 0 0 4px var(--v100)}
.search{position:relative}
.search input{padding-inline-start:42px;border-radius:16px}
.search svg{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:8px 14px;font-size:14px;font-weight:500;transition:all .15s}
.seg button.on{border-color:var(--v600);background:var(--v600);color:#fff;box-shadow:0 6px 14px rgba(124,58,237,.25)}
.tabs{display:flex;gap:4px;background:var(--soft);border-radius:14px;padding:4px;overflow-x:auto}
.tab{border:0;background:transparent;color:var(--muted);padding:8px 14px;border-radius:11px;font-size:14px;font-weight:500;white-space:nowrap;flex:1}
.tab.on{background:var(--card);color:var(--v700);box-shadow:var(--sh);font-weight:600}
:root[data-theme="dark"] .tab.on{color:var(--v300)}
.switch{width:52px;height:30px;border-radius:999px;background:var(--line);border:0;position:relative;transition:background .2s;flex:none}
.switch:after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:inset-inline-start .2s}
.switch.on{background:var(--v600)}
.switch.on:after{inset-inline-start:25px}

/* ===== الصور الرمزية وحلقات التقدّم ===== */
.av{position:relative;width:56px;height:56px;flex:none}
.av svg{position:absolute;inset:0;transform:rotate(-90deg)}
.av .in{position:absolute;inset:6px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:Changa;font-weight:700;font-size:17px}
.tcard{display:flex;gap:14px;align-items:center;cursor:pointer;transition:transform .15s,box-shadow .2s,border-color .2s;padding:14px}
.tcard:hover{transform:translateY(-2px);border-color:var(--v300)}
.tcard .b{flex:1;min-width:0}
.tcard h3{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score-pill{font-family:Changa;font-weight:700;font-size:17px;padding:4px 10px;border-radius:12px;background:var(--ok-l);color:var(--ok)}

/* ===== شريط التنقل ===== */
.bnav{position:fixed;inset-inline:12px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:30;height:var(--nav-h);display:flex;align-items:stretch;justify-content:space-around;padding:6px;border-radius:24px;background:rgba(255,255,255,.86);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);box-shadow:0 12px 40px rgba(30,11,58,.25);border:1px solid rgba(255,255,255,.6);max-width:560px;margin:0 auto}
:root[data-theme="dark"] .bnav{background:rgba(31,20,51,.86);border-color:rgba(255,255,255,.08)}
.bnav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;font-family:Changa;font-size:12px;color:var(--muted);border-radius:18px;transition:all .2s}
.bnav a.on{color:var(--v700);background:var(--v100)}
:root[data-theme="dark"] .bnav a.on{color:var(--v300)}
@media (min-width:900px){
  .bnav{position:absolute;top:calc(70px + env(safe-area-inset-top));bottom:auto;inset-inline:auto;left:50%;transform:translateX(-50%);height:50px;width:auto;padding:5px;background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.2);box-shadow:none}
  .topbar{margin-bottom:56px}
  :root[data-theme="dark"] .bnav{background:rgba(255,255,255,.08)}
  .bnav a{flex-direction:row;gap:7px;padding:0 16px;font-size:14px;color:rgba(255,255,255,.85)}
  .bnav a.on{background:#fff;color:var(--v700)}
  .panel{padding-bottom:60px}
}

/* ===== الأوراق المنبثقة ===== */
.sheet-bg{position:fixed;inset:0;background:rgba(20,6,40,.5);backdrop-filter:blur(3px);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@media (min-width:700px){.sheet-bg{align-items:center}}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;padding:10px 20px calc(20px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.2,.8,.2,1);box-shadow:var(--sh-lg)}
@media (min-width:700px){.sheet{border-radius:28px;padding-top:18px}.sheet .grab{display:none}}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet h3{font-size:20px;margin-bottom:14px}
.sheet .acts{display:flex;gap:10px;margin-top:18px}
.sheet .acts .btn{flex:1}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:.3}}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 26px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--v950);color:#fff;padding:11px 18px;border-radius:14px;z-index:80;font-family:Changa;font-size:14.5px;box-shadow:var(--sh-lg);max-width:calc(100% - 32px);animation:up .25s;display:flex;gap:8px;align-items:center}
.toast.err{background:var(--bad)}
@keyframes sp{to{transform:rotate(360deg)}}

/* ===== هياكل التحميل ===== */
.sk{background:linear-gradient(90deg,var(--soft) 25%,var(--line) 50%,var(--soft) 75%);background-size:200% 100%;animation:shim 1.2s infinite;border-radius:14px}
@keyframes shim{to{background-position:-200% 0}}

/* ===== الدخول ===== */
.login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 16px calc(28px + env(safe-area-inset-bottom));position:relative;z-index:1;color:#fff}
.login .brandbig{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:22px;text-align:center}
.login .brandbig .mark{width:66px;height:66px;border-radius:22px}
.login h1{font-size:28px;font-weight:700}
.lcard{width:100%;max-width:440px;background:var(--card);color:var(--ink);border-radius:28px;padding:22px;box-shadow:var(--sh-lg)}
.lstep-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.lstep-h h2{font-size:18px;flex:1}
.school-list{max-height:46vh;overflow:auto;margin-top:12px;display:grid;gap:6px}
.school-list button{display:flex;align-items:center;gap:12px;text-align:start;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:10px 12px;font-size:14.5px;font-weight:500;transition:all .15s}
.school-list button:hover{border-color:var(--v400);background:var(--v50)}
.school-list .ini{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:700;color:#fff;flex:none}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.names button{border:1.5px solid var(--line);background:var(--card);border-radius:18px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13.5px;font-weight:500;line-height:1.35;transition:all .15s}
.names button:hover{border-color:var(--v400);transform:translateY(-2px)}
.names .ini{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:18px}
.names .role{font-size:11.5px;color:var(--muted)}
.pin-top{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.pin-top .ini{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:Changa;font-weight:700;font-size:21px}
.dots{display:flex;gap:12px;justify-content:center;margin:18px 0 6px;direction:ltr;min-height:16px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--v300);transition:all .15s}
.dots i.on{background:var(--v600);border-color:var(--v600);transform:scale(1.1)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px;direction:ltr}
.pad button{height:62px;border-radius:20px;border:0;background:var(--soft);font-size:25px;font-weight:600;transition:transform .08s,background .15s}
.pad button:active{transform:scale(.93);background:var(--v100)}
.pad .ok{background:linear-gradient(140deg,var(--v500),var(--v700));color:#fff}
.pad .ghost{background:transparent}

/* ===== الزيارات ===== */
.slot{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:18px;background:var(--card);box-shadow:var(--sh)}
.slot .n{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-family:Changa;font-weight:700;background:var(--soft);color:var(--muted);flex:none}
.slot.done .n{background:var(--ok-l);color:var(--ok)}
.slot.open .n{background:var(--amber-l);color:var(--warn)}
.slot .b{flex:1;min-width:0}
.slot.click{cursor:pointer;transition:transform .15s}
.slot.click:hover{transform:translateX(-3px)}
.timeline{position:relative;padding-inline-start:22px}
.timeline:before{content:"";position:absolute;inset-inline-start:7px;top:8px;bottom:8px;width:2px;background:var(--line);border-radius:2px}
.tl{position:relative;margin-bottom:12px}
.tl:before{content:"";position:absolute;inset-inline-start:-21px;top:20px;width:12px;height:12px;border-radius:50%;background:var(--v500);box-shadow:0 0 0 4px var(--v100)}
.bar{height:10px;border-radius:6px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--v400),var(--v700));border-radius:6px;transition:width .4s}

/* ===== العدّاد النصف دائري ===== */
.gauge{position:relative;width:230px;margin:0 auto}
.gauge svg{display:block;width:100%}
.gauge .val{position:absolute;left:0;right:0;bottom:2px;text-align:center}
.gauge .val b{display:block;font-family:Changa;font-size:44px;font-weight:800;line-height:1}
.gauge .val span{font-family:Changa;font-size:15px;font-weight:600}

/* ===== الساعة ===== */
.clock-disp{display:flex;justify-content:center;align-items:baseline;gap:4px;direction:ltr;font-family:Changa;font-weight:700;font-size:54px;line-height:1}
.clock-disp button{border:0;background:transparent;font:inherit;color:var(--muted);padding:2px 10px;border-radius:16px}
.clock-disp button.on{color:var(--v700);background:var(--v100)}
:root[data-theme="dark"] .clock-disp button.on{color:var(--v300)}
.dial{width:280px;max-width:100%;margin:12px auto 0;display:block;touch-action:none;user-select:none}
.dial text{font-family:Changa;font-size:15px;fill:var(--ink);pointer-events:none}
.dial text.inner{font-size:12.5px;fill:var(--muted)}
.dial text.sel{fill:#fff}
.timepair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.timetile{border:1.5px solid var(--line);background:var(--card);border-radius:18px;padding:10px 14px;text-align:start;transition:all .15s;display:flex;flex-direction:column;gap:4px;line-height:1.2;height:auto;font-family:Changa}
.timetile:hover{border-color:var(--v400)}
.timetile small{display:block;font-size:12.5px;color:var(--muted)}

/* ============================== النخب والأوراق ============================== */
function toast(msg, err){
  $$('.toast').forEach(x => x.remove());
  const t = document.createElement('div');
  t.className = 'toast' + (err ? ' err' : '');
  t.textContent = msg;
  document.body.appendChild(t);
  if (err) buzz([20, 40, 20]);
  setTimeout(() => t.remove(), err ? 4200 : 2400);
}

function sheet(html, onMount, onClose){
  const bg = document.createElement('div');
  bg.className = 'sheet-bg';
  bg.innerHTML = '<div class="sheet"><div class="grab"></div>' + html + '</div>';
  document.body.appendChild(bg);
  let closed = false;
  const close = () => { if (closed) return; closed = true; bg.remove(); if (onClose) onClose(); };
  bg.addEventListener('click', e => { if (e.target === bg) close(); });
  bg.querySelectorAll('[data-close]').forEach(b => b.onclick = close);
  // سحب الورقة للأسفل لإغلاقها
  const sh = bg.querySelector('.sheet');
  let y0 = null;
  sh.addEventListener('touchstart', e => { if (sh.scrollTop <= 0 && e.target.closest('.grab,h3')) y0 = e.touches[0].clientY; }, { passive: true });
  sh.addEventListener('touchmove', e => { if (y0 === null) return; const dy = e.touches[0].clientY - y0; if (dy > 0) sh.style.transform = `translateY(${dy}px)`; }, { passive: true });
  sh.addEventListener('touchend', e => { if (y0 === null) return; const dy = e.changedTouches[0].clientY - y0; y0 = null; if (dy > 110) close(); else sh.style.transform = ''; });
  if (onMount) onMount(sh, close);
  return close;
}
function confirmBox(title, text, okLabel, cls){

    sheet(`<h3>${esc(title)}</h3><p style="margin:0">${text}</p><div class="acts"><button class="btn btn-g" data-close>إلغاء</button><button class="btn ${cls || 'btn-p'}" id="cfOk">${esc(okLabel || 'تأكيد')}</button></div>`,
      (m, close) => { m.querySelector('#cfOk').onclick = () => { ok = true; close(); }; },
      () => res(ok));
  });
}
async function busy(el, fn){
  if (el) el.classList.add('busy');

}

/* ============================== الاتصال ============================== */
async function api(action, payload = {}){
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 35000);
  let res;
  try{
    res = await fetch(API_URL, {
      method: 'POST', redirect: 'follow', signal: ctl.signal,
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ action, auth: S.auth ? { school: S.auth.school, user: S.auth.user, code: S.auth.code } : null }, payload))
    });
  } catch(e){
    const err = new Error('تعذّر الاتصال بالخادم، تحقق من الإنترنت'); err.net = true; throw err;
  } finally { clearTimeout(timer); }
  let j;
  try { j = await res.json(); } catch(e){ const err = new Error('ردّ غير مفهوم من الخادم'); err.net = true; throw err; }
  if (!j.ok) throw new Error(j.error || 'خطأ غير معروف');
  return j.data;
}
// إيقاظ الخادم مبكرًا بينما يختار المستخدم مدرسته
try { if (/^https?:/.test(API_URL)) fetch(API_URL, { method: 'GET' }).catch(() => {}); } catch(e){}

/* ===== طابور الحفظ في الخلفية (التحديث المتفائل) ===== */
const Q = { jobs: [], running: false };
function setSync(state){
  Q.state = state;
  $$('.sync').forEach(el => {
    el.className = 'sync ' + (state === 'ok' ? '' : state);
    el.querySelector('span').textContent = state === 'busy' ? 'يُحفظ…' : state === 'offline' ? 'غير متصل — سيُعاد' : 'محفوظ';
  });
}
function enqueue(job){ Q.jobs.push(job); setSync('busy'); runQ(); }
async function runQ(){
  if (Q.running) return;
  Q.running = true;
  while (Q.jobs.length){
    const j = Q.jobs[0];
    const payload = typeof j.payload === 'function' ? j.payload() : j.payload;
    if (payload === null){ Q.jobs.shift(); continue; }
    try{
      setSync('busy');
      const r = await api(j.action, payload);
      Q.jobs.shift();
      if (j.onOk) j.onOk(r, payload);
    } catch(e){
      if (e.net){ setSync('offline'); await wait(4000); continue; }
      Q.jobs.shift();
      if (j.onFail) j.onFail(e);
      toast(e.message, true);
      if (/الجلسة|الحساب|المؤقت/.test(e.message)) { logout(true); break; }
    }
  }
  Q.running = false;
  setSync('ok');
  persist();
}
window.addEventListener('beforeunload', e => { if (Q.jobs.length){ e.preventDefault(); e.returnValue = ''; } });

let persistT;

const teacher = id => allTeachers().find(t => t.id === id);
const user = id => B().users.find(u => u.id === id);
const userName = id => (user(id) || {}).name || '—';
const visitsOf = tid => B().visits.filter(v => v.teacher === tid).sort((a, b) => a.number - b.number);
const sessionsOf = vid => B().sessions.filter(s => s.visit === vid).sort((a, b) => a.number - b.number);
const resultsOf = vid => (B().results[vid] = B().results[vid] || {});
const itemsFor = type => B().cfg.items.filter(it => it.scope === 'الكل' || it.scope === type);
const axisOf = id => B().cfg.axes.find(a => a.id === id);
const visitById = id => B().visits.find(v => v.id === id);
const draftKey = vid => 'ishraf.draft.' + S.auth.school + '.' + vid;
const getDraft = vid => LS.get(draftKey(vid)) || {};
const setDraft = (vid, d) => Object.keys(d).length ? LS.set(draftKey(vid), d) : LS.del(draftKey(vid));
const valueOf = (vid, id) => { const d = getDraft(vid); if (d[id] !== undefined) return d[id]; const r = resultsOf(vid)[id]; return r ? r.value : undefined; };

const PALETTE = ['#7C3AED','#A0522D','#0E9F6E','#DB2777','#2563EB','#E69138','#0891B2','#9333EA','#C2410C','#4F46E5'];
function hue(str){ let h = 0; for (const c of String(str)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return PALETTE[h % PALETTE.length]; }
function initials(name){ const p = String(name || '').trim().split(/\s+/); return ((p[0] || '')[0] || '') + ((p[1] || '')[0] || ''); }
function avGrad(name){ const c = hue(name); return `background:linear-gradient(140deg,${c},${c}CC)`; }

function progress(v){
  const t = teacher(v.teacher);
  const items = itemsFor(t ? t.type : '');
  const done = items.filter(it => valueOf(v.id, it.id) !== undefined).length;
  return { done, total: items.length, pct: items.length ? Math.round(done * 100 / items.length) : 0 };
}
function computeScore(items, scores){
  const cfg = B().cfg;
  let sum = 0, w = 0;
  const perAxis = {};
  cfg.axes.forEach(ax => {
    const vals = items.filter(it => it.axis === ax.id && it.kind === 'علامة' && scores[it.id] !== undefined).map(it => Number(scores[it.id]));
    if (!vals.length) return;
    const avg = vals.reduce((a, b) => a + b, 0) / vals.length;
    perAxis[ax.id] = avg;
    if (ax.coef > 0){ sum += avg * ax.coef; w += ax.coef; }
  });
  const score = w ? Math.round(((sum / w - cfg.min) / (cfg.max - cfg.min)) * 1000) / 10 : null;
  let grade = '';
  if (score !== null) cfg.scale.forEach(s => { if (score >= s.min) grade = s.label; });
  return { score, grade, perAxis };
}
function scoreColor(s){ return s === null || s === undefined || s === '' ? '#8B80A6' : s < 50 ? '#E5484D' : s < 65 ? '#F08A3E' : s < 80 ? '#5FAE3A' : '#13A26C'; }
async function drain(ms = 20000){ const t0 = Date.now(); while ((Q.jobs.length || Q.running) && Date.now() - t0 < ms) await wait(200); }
function teacherState(t){
  const vs = visitsOf(t.id);
  if (vs.some(v => v.status === 'مفتوحة')) return 'open';
  if (vs.filter(v => v.status === 'مكتملة').length >= t.planned) return 'done';
  return vs.length ? 'progress' : 'none';
}

/* ============================== مكوّنات مرئية ============================== */
function ring(pct, color, size = 56, stroke = 4){
  const r = size / 2 - stroke / 2 - 1, c = 2 * Math.PI * r;
  return `<svg width="${size}" height="${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--line)" stroke-width="${stroke}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - Math.min(1, pct))}" style="transition:stroke-dashoffset .6s"/></svg>`;
}
function avatar(name, pct, color){
  return `<div class="av">${ring(pct, color)}<div class="in" style="${avGrad(name)}">${esc(initials(name))}</div></div>`;
}
function miniRing(done, total){
  const pct = total ? done / total : 0;
  return `<div class="mini-ring">${ring(pct, pct >= 1 ? 'var(--ok)' : 'var(--v600)', 44, 4)}<b>${Math.round(pct * 100)}%</b></div>`;
}
function gauge(score, grade, id){
  const r = 90, c = Math.PI * r;
  const pct = score === null || score === undefined ? 0 : score / 100;
  return `<div class="gauge" id="${id || 'g'}" data-score="${score ?? ''}">
    <svg viewBox="0 0 220 124"><path d="M20 112 A90 90 0 0 1 200 112" fill="none" stroke="var(--line)" stroke-width="16" stroke-linecap="round"/>
      <path class="arc" d="M20 112 A90 90 0 0 1 200 112" fill="none" stroke="${scoreColor(score)}" stroke-width="16" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c}" data-target="${c * (1 - pct)}" style="transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)"/></svg>
    <div class="val"><b style="color:${scoreColor(score)}">${score === null || score === undefined ? '—' : '0'}</b><span style="color:${scoreColor(score)}">${esc(grade || '')}</span></div></div>`;
}
function animateGauges(){
  $$('.gauge').forEach(g => {
    const arc = g.querySelector('.arc'), b = g.querySelector('.val b');
    const target = parseFloat(g.dataset.score);
    requestAnimationFrame(() => requestAnimationFrame(() => { arc.style.strokeDashoffset = arc.dataset.target; }));
    if (isNaN(target)) return;
    const t0 = performance.now();
    const step = now => { const k = Math.min(1, (now - t0) / 1100); const e = 1 - Math.pow(1 - k, 3); b.textContent = (Math.round(target * e * 10) / 10).toString(); if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}
function emptyBox(text){ return `<div class="card empty">${IC.empty}<div>${text}</div></div>`; }
function skeleton(){
  return `<div class="hero"><div class="wrap"><div class="topbar"><div class="mark">${IC.book}</div><div class="tb-t"><b>الإشراف التربوي</b><small>جارٍ التحميل…</small></div></div>
    <div class="sk" style="height:30px;width:55%;margin-top:22px;opacity:.35"></div>
    <div class="kpis">${'<div class="sk" style="height:74px;opacity:.3"></div>'.repeat(3)}</div></div></div>
    <div class="panel"><div class="wrap stack">${'<div class="sk" style="height:84px"></div>'.repeat(5)}</div></div>`;
}

/* ============================== التوجيه ============================== */
const ROUTES_DEPTH = { '': 0, sup: 0, tea: 0, vis: 0, visits: 0, stats: 0, me: 0, t: 1, v: 2, fill: 3, close: 3, report: 3 };
function go(h){ if (location.hash === h) render(); else location.hash = h; }
window.addEventListener('hashchange', () => render());

function route(){ const p = location.hash.replace(/^#\/?/, '').split('/'); return { r: p[0] || '', id: p[1] }; }

async function boot(){
  if (!S.auth) return render();
  const cached = LS.get(bootKey());
  if (cached && cached.cfg){ S.B = cached; render(); refreshBg(); return; }
  $('#app').innerHTML = skeleton();
  try { S.B = await api('bootstrap'); persist(); render(); }
  catch(e){ handleAuthError(e) || ($('#app').innerHTML = `<div class="login"><div class="lcard stack"><div class="banner">${esc(e.message)}</div><button class="btn btn-p btn-block" onclick="boot()">إعادة المحاولة</button></div></div>`); }
}
function handleAuthError(e){
  if (/الجلسة|الحساب|المؤقت/.test(e.message)){ logout(true); toast(e.message, true); return true; }
  return false;
}
async function refreshBg(){
  if (Q.jobs.length || Q.running) return;
  try{
    setSync('busy');
    const fresh = await api('bootstrap');
    setSync('ok');
    if (Q.jobs.length) return;
    if (JSON.stringify(fresh) !== JSON.stringify(S.B)){
      S.B = fresh; persist();
      if (!$('.sheet-bg') && !document.activeElement.matches('input,textarea')) render(true);
    }
  } catch(e){ setSync(e.net ? 'offline' : 'ok'); handleAuthError(e); }
}
function logout(silent){
  if (S.auth) LS.del(bootKey());
  S.auth = null; S.B = null; LS.del('ishraf.auth'); S.L = { step: '' };
  if (!silent) toast('تم الخروج');
  history.replaceState(null, '', location.pathname);
  render();
}

function render(keep){
  // أثناء التحميل الأول نعرض الهياكل، ولا نعود لشاشة الدخول إلا إن لم يكن هناك حساب
  if (S.auth && !S.B && !['new1', 'new2'].includes(S.L.step)){ $('#app').innerHTML = skeleton(); return; }
  if (!S.auth || !S.B) return renderLogin();
  const { r, id } = route();
  const depth = ROUTES_DEPTH[r] ?? 0;
  const anim = S.lastRoute === location.hash ? '' : depth >= S.lastDepth ? 'enter-f' : 'enter-b';
  if (S.lastRoute !== location.hash && !keep) window.scrollTo(0, 0);
  S.lastRoute = location.hash; S.lastDepth = depth;
  const y = scrollY;
  if (r === 'report') return renderReport(id);
  let v;
  if (r === 'stats') v = viewStats();
  else if (r === 't') v = viewTeacher(id);
  else if (r === 'v') v = viewVisit(id);
  else if (r === 'fill') v = viewFill(id);
  else if (r === 'close') v = viewClose(id);
  else if (r === 'me') v = viewMe();
  else if (isDir()) v = viewDirector(['sup', 'tea', 'vis'].includes(r) ? r : 'sup');
  else v = r === 'visits' ? viewMyVisits() : viewSupervisor();
  const noNav = r === 'fill';
  $('#app').innerHTML = `<div class="hero"><div class="wrap">${topbar()}${v.hero || ''}</div></div>
    <div class="panel"><div class="wrap ${anim}">${v.body}</div></div>${noNav ? '' : bottomNav(r)}${v.after || ''}`;
  setSync(Q.jobs.length ? 'busy' : (Q.state === 'offline' ? 'offline' : 'ok'));
  if (keep) window.scrollTo(0, y);
  if (v.mount) v.mount();
  animateGauges();
}
function topbar(){
  return `<div class="topbar"><div class="mark">${IC.book}</div>
    <div class="tb-t"><b>${esc(B().school.name || 'الإشراف التربوي')}</b><small>${esc(B().cfg.season)} · ${esc(S.auth.role)}</small></div>
    <span class="sync"><i></i><span>محفوظ</span></span></div>`;
}
function bottomNav(r){
  const items = isDir()
    ? [['#/sup', 'sup', 'المشرفون', IC.shield], ['#/tea', 'tea', 'المعلمون', IC.users], ['#/vis', 'vis', 'الزيارات', IC.clip], ['#/stats', 'stats', 'الإحصاءات', IC.chart], ['#/me', 'me', 'حسابي', IC.me]]
    : [['#/', '', 'معلميّ', IC.users], ['#/visits', 'visits', 'الزيارات', IC.clip], ['#/stats', 'stats', 'الإحصاءات', IC.chart], ['#/me', 'me', 'حسابي', IC.me]];
  const cur = ['t', 'v', 'close'].includes(r) ? (isDir() ? 'tea' : '') : (isDir() && r === '' ? 'sup' : r);
  return `<nav class="bnav">${items.map(([h, k, l, i]) => `<a href="${h}" class="${k === cur ? 'on' : ''}">${i}<span>${l}</span></a>`).join('')}</nav>`;

async function loadDir(force){
  const cached = LS.get('ishraf.dir');
  if (cached && !force) { S.L.dir = cached; api('start').then(d => { LS.set('ishraf.dir', d); if (JSON.stringify(d) !== JSON.stringify(S.L.dir)){ S.L.dir = d; if (!S.auth && !['pin', 'new1', 'new2'].includes(S.L.step)) renderLogin(); } }).catch(() => {}); return; }
  S.L.dir = await api('start');
  LS.set('ishraf.dir', S.L.dir);
}

async function renderLogin(){
  const L = S.L;
  const last = LS.get('ishraf.last') || {};
  if (!L.dir){
    $('#app').innerHTML = loginFrame('<div class="stack"><div class="sk" style="height:48px"></div><div class="sk" style="height:56px"></div><div class="sk" style="height:56px"></div><div class="sk" style="height:56px"></div></div>');
    try { await loadDir(); if (S.auth && S.B) return; }
    catch(e){ $('#app').innerHTML = loginFrame(`<div class="stack"><div class="banner">${esc(e.message)}</div><button class="btn btn-p btn-block" id="retry">إعادة المحاولة</button></div>`); $('#retry').onclick = () => renderLogin(); return; }
  }
  const schools = L.dir.schools;
  if (!L.step){
    if (last.school && schools.some(s => s.code === last.school)){ L.school = last.school; L.step = 'name'; }
    else L.step = 'school';
  }
  const school = schools.find(s => s.code === L.school);
  let body = '';

  if (L.step === 'school'){
    body = `<div class="lstep-h"><h2>اختر مدرستك</h2></div>
      <div class="search">${IC.search}<input id="ss" placeholder="ابحث عن مدرستك…" autocomplete="off"></div>
      <div class="school-list" id="sl"></div>`;
  } else if (L.step === 'name'){
    const users = L.dir.users.filter(u => u.school === L.school).sort((a, b) => a.role === b.role ? a.name.localeCompare(b.name, 'ar') : a.role === 'مدير' ? -1 : 1);
    body = `<div class="lstep-h"><h2>من أنت؟</h2><button class="chip v" id="chSch" style="border:0">${esc(school ? school.name : '')} · تغيير</button></div>
      ${users.length ? `<div class="names">${users.map(u => `<button data-u="${esc(u.id)}"><span class="ini" style="${avGrad(u.name)}">${esc(initials(u.name))}</span><span>${esc(u.name)}</span><span class="role">${esc(u.role)}</span></button>`).join('')}</div>`
        : `<div class="banner">لا يوجد مستخدمون في هذه المدرسة بعد. اتصل بالإدارة العامة.</div>`}`;
  } else if (L.step === 'pin' || L.step === 'new1' || L.step === 'new2'){
    const u = L.dir.users.find(x => x.id === L.user) || L.userObj || {};
    const title = L.step === 'pin' ? 'أدخل رمزك' : L.step === 'new1' ? 'اختر رمزك الشخصي' : 'أعد كتابة الرمز للتأكيد';
    const sub = L.step === 'pin' ? '' : '<div class="banner v" style="margin-top:10px">هذا دخولك الأول. اختر رمزًا من 4 إلى 8 أرقام تحفظه.</div>';
    body = `<div class="pin-top"><span class="ini" style="${avGrad(u.name)}">${esc(initials(u.name))}</span><b class="d" style="font-size:17px">${esc(u.name || '')}</b><span class="muted small">${title}</span></div>${sub}
      <div class="dots" id="dots"></div>
      <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n => `<button data-k="${n}">${n}</button>`).join('')}
        <button data-k="del" class="ghost" aria-label="حذف">${IC.del}</button><button data-k="0">0</button><button data-k="ok" class="ok" aria-label="دخول">${IC.check}</button></div>
      <div class="row" style="justify-content:space-between;margin-top:14px"><button class="chip" id="backName" style="border:0">رجوع</button><span class="muted small">نسيت رمزك؟ اتصل بالإدارة العامة</span></div>`;
  }
  $('#app').innerHTML = loginFrame(body);

  if (L.step === 'school'){
    const draw = q => {
      const list = schools.filter(s => !q || s.name.includes(q));
      $('#sl').innerHTML = list.map(s => `<button data-s="${esc(s.code)}"><span class="ini" style="${avGrad(s.name)}">${esc(s.name.replace(/^(ابتدائية|متوسطة|دار)\s+/, '').trim()[0] || '')}</span><span>${esc(s.name)}</span></button>`).join('') || '<div class="muted small" style="text-align:center;padding:12px">لا نتائج</div>';
    };
    draw('');
    $('#ss').oninput = e => draw(e.target.value.trim());
    $('#sl').onclick = e => { const b = e.target.closest('[data-s]'); if (!b) return; buzz(); L.school = b.dataset.s; L.step = 'name'; renderLogin(); };
  }
  if (L.step === 'name'){
    $('#chSch').onclick = () => { L.step = 'school'; renderLogin(); };
    $$('.names [data-u]').forEach(b => b.onclick = () => { buzz(); L.user = b.dataset.u; L.step = 'pin'; L.code = ''; renderLogin(); });
  }
  if (['pin', 'new1', 'new2'].includes(L.step)){
    L.code = '';
    const dots = () => { $('#dots').innerHTML = Array.from({ length: Math.max(4, L.code.length) }, (_, i) => `<i class="${i < L.code.length ? 'on' : ''}"></i>`).join(''); };
    dots();
    const fail = msg => { const d = $('#dots'); d.classList.remove('shake'); void d.offsetWidth; d.classList.add('shake'); buzz([30, 50, 30]); L.code = ''; dots(); if (msg) toast(msg, true); };
    const submit = async () => {
      if (L.code.length < 4) return fail('الرمز من 4 أرقام على الأقل');
      const okBtn = $('.pad .ok');
      if (L.step === 'pin'){
        try{
          const r = await busy(okBtn, () => api('login', { auth: { school: L.school, user: L.user, code: L.code } }));
          S.auth = { school: L.school, user: L.user, code: L.code, name: r.user.name, role: r.user.role };
          LS.set('ishraf.last', { school: L.school, user: L.user });
          if (r.mustChange){ L.userObj = r.user; L.step = 'new1'; return renderLogin(); }
          finishLogin(r.boot);
        } catch(e){ fail(e.message); }
      } else if (L.step === 'new1'){
        if (L.code === S.auth.code) return fail('اختر رمزًا مختلفًا عن الرمز المؤقت');
        L.newCode = L.code; L.step = 'new2'; renderLogin();
      } else {
        if (L.code !== L.newCode){ L.step = 'new1'; renderLogin(); return toast('الرمزان غير متطابقين، أعد المحاولة', true); }
        try{
          const r = await busy(okBtn, () => api('changeCode', { newCode: L.code }));
          S.auth.code = L.code;
          toast('تم حفظ رمزك');
          finishLogin(r.boot);
        } catch(e){ fail(e.message); }
      }
    };
    const press = k => {
      if ($('.pad .ok.busy')) return;
      if (k === 'del'){ L.code = L.code.slice(0, -1); buzz(5); return dots(); }
      if (k === 'ok') return submit();
      if (L.code.length >= 8) return;
      L.code += k; buzz(5); dots();
    };
    $('.pad').onclick = e => { const b = e.target.closest('[data-k]'); if (b) press(b.dataset.k); };
    document.onkeydown = e => {
      if (!['pin', 'new1', 'new2'].includes(S.L.step) || S.auth && S.B) return;
      if (/^\d$/.test(e.key)) press(e.key); else if (e.key === 'Backspace') press('del'); else if (e.key === 'Enter') press('ok');
    };
    $('#backName').onclick = () => { if (L.step !== 'pin'){ S.auth = null; } L.step = 'name'; renderLogin(); };
  }
}
function loginFrame(body){
  return `<div class="login"><div class="brandbig"><div class="mark">${IC.bookBig}</div><h1>الإشراف التربوي</h1></div>
    <div class="lcard enter-f">${body}</div></div>`;
}
function finishLogin(boot){
  document.onkeydown = null;
  LS.set('ishraf.auth', S.auth);
  S.B = boot; persist();
  S.L = { step: '', dir: S.L.dir };
  history.replaceState(null, '', location.pathname + '#/');
  S.lastRoute = null;
  render();
}

/* ============================== المشرف: الرئيسية ============================== */
function teacherCard(t){
  const vs = visitsOf(t.id);
  const done = vs.filter(v => v.status === 'مكتملة').length;
  const st = teacherState(t);
  const color = st === 'open' ? 'var(--amber)' : st === 'done' ? 'var(--ok)' : 'var(--v600)';
  const last = vs.filter(v => v.score !== null).pop();
  const chip = { open: '<span class="chip warn">زيارة مفتوحة</span>', done: '<span class="chip ok">اكتملت</span>', progress: `<span class="chip v">${done}/${t.planned}</span>`, none: '<span class="chip">لم تبدأ</span>' }[st];
  return `<div class="card tcard" data-go="#/t/${esc(t.id)}">${avatar(tName(t), t.planned ? done / t.planned : 0, color)}
    <div class="b"><h3>${esc(tName(t))}</h3>
      <div class="small muted">${esc(t.level || '—')} · ${esc(t.type || '—')}${t.experience === 0 ? ' · <span class="chip clay" style="padding:0 8px">جديد</span>' : ''}</div>
      <div class="row" style="margin-top:4px;gap:6px">${chip}${isDir() ? `<span class="small muted">${esc(t.supervisor ? userName(t.supervisor) : 'غير مسند')}</span>` : ''}</div></div>
    ${last ? `<span class="score-pill" style="background:${scoreColor(last.score)}22;color:${scoreColor(last.score)}">${last.score}</span>` : ''}</div>`;
}
function filterTeachers(list){
  const q = S.q.trim();
  return list.filter(t => (!q || tName(t).includes(q) || (t.level || '').includes(q)) &&
    (S.filter === 'all' || teacherState(t) === S.filter || (S.filter === 'none' && teacherState(t) === 'progress')));
}
function viewSupervisor(){
  const ts = B().teachers.filter(t => t.active);
  const planned = ts.reduce((a, t) => a + t.planned, 0);
  const mine = B().visits.filter(v => v.supervisor === S.auth.user);
  const done = mine.filter(v => v.status === 'مكتملة').length;
  const open = mine.filter(v => v.status === 'مفتوحة').length;
  const first = S.auth.name.split(' ')[0];
  const list = filterTeachers(ts);
  const extra = B().extraTeachers || [];
  const f = (k, l) => `<button class="tab ${S.filter === k ? 'on' : ''}" data-act="filter" data-k="${k}">${l}</button>`;
  return {
    hero: `<h1>مرحبًا، ${esc(first)}</h1><div class="sub">${done ? `أنجزت ${done} من ${planned} زيارة هذا الموسم` : 'لنبدأ زيارات هذا الموسم'}</div>
      <div class="kpis"><div class="kpi glass"><div class="n">${ts.length}</div><div class="l">معلم مسند</div></div>
        <div class="kpi glass"><div class="n">${done}<small> / ${planned}</small></div><div class="l">زيارة مكتملة</div></div>
        <div class="kpi glass accent"><div class="n">${open}</div><div class="l">مفتوحة الآن</div></div></div>`,
    body: `<div class="stack">
      <div class="spread"><div class="sec-t" style="margin:0">معلميّ</div>
        <div class="row"><button class="btn btn-g" data-act="import">${IC.xls} استيراد</button><button class="btn btn-p" data-act="addTeacher">${IC.plus} معلم</button></div></div>
      <div class="search">${IC.search}<input id="q" placeholder="ابحث باسم المعلم أو المستوى" value="${esc(S.q)}"></div>
      <div class="tabs">${f('all', 'الكل')}${f('none', 'لم تكتمل')}${f('open', 'مفتوحة')}${f('done', 'مكتملة')}</div>
      ${list.length ? `<div class="grid g2">${list.map(teacherCard).join('')}</div>` : emptyBox(ts.length ? 'لا نتائج مطابقة' : 'لا يوجد معلمون مسندون إليك بعد.<br>أضف معلمًا أو استورد قائمة من إكسل، أو اطلب من المدير إسنادهم إليك.')}
      ${extra.length ? `<div class="sec-t" style="margin-top:22px">زيارات سابقة لمعلمين نُقلوا</div><div class="grid g2">${extra.map(teacherCard).join('')}</div>` : ''}
    </div>`,
    mount: bindSearch
  };
}
function bindSearch(){
  const q = $('#q'); if (!q) return;
  q.oninput = () => { S.q = q.value; const pos = q.selectionStart; render(true); const n = $('#q'); if (n){ n.focus(); n.setSelectionRange(pos, pos); } };
}
function visitRow(v, showSup){
  const t = teacher(v.teacher);
  const p = progress(v);
  return `<div class="slot click ${v.status === 'مكتملة' ? 'done' : 'open'}" data-go="#/v/${esc(v.id)}">
    <div class="n">${v.number}</div>
    <div class="b"><b class="d">${esc(tName(t))}</b><div class="small muted">${v.status === 'مكتملة' ? 'مكتملة · ' + esc((v.closed || '').slice(0, 10)) : `مفتوحة · ${p.done}/${p.total} بند`}${showSup ? ' · ' + esc(userName(v.supervisor)) : ''}</div></div>
    ${v.status === 'مكتملة' ? `<span class="score-pill" style="background:${scoreColor(v.score)}22;color:${scoreColor(v.score)}">${v.score ?? '—'}</span>` : miniRing(p.done, p.total)}</div>`;
}
function viewMyVisits(){
  const mine = B().visits.filter(v => v.supervisor === S.auth.user);
  const open = mine.filter(v => v.status === 'مفتوحة');
  const done = mine.filter(v => v.status === 'مكتملة').sort((a, b) => (b.closed || '').localeCompare(a.closed || ''));
  const avg = done.length ? Math.round(done.reduce((a, v) => a + (v.score || 0), 0) / done.length * 10) / 10 : null;
  return {
    hero: `<h1>زياراتي</h1><div class="sub">الموسم ${esc(B().cfg.season)}</div>
      <div class="kpis"><div class="kpi glass accent"><div class="n">${open.length}</div><div class="l">مفتوحة</div></div>
        <div class="kpi glass"><div class="n">${done.length}</div><div class="l">مكتملة</div></div>
        <div class="kpi glass"><div class="n">${avg ?? '—'}</div><div class="l">متوسط النقاط</div></div></div>`,
    body: `<div class="stack">
      ${open.length ? `<div class="sec-t">مفتوحة الآن</div><div class="stack">${open.map(v => visitRow(v)).join('')}</div>` : ''}
      <div class="sec-t" style="margin-top:18px">المكتملة</div>
      ${done.length ? `<div class="stack">${done.map(v => visitRow(v)).join('')}</div>` : emptyBox('لم تُغلق أي زيارة بعد')}
    </div>`
  };
}

/* ============================== صفحة المعلم ============================== */
function viewTeacher(id){
  const t = teacher(id);
  if (!t) return { body: emptyBox('المعلم غير موجود') };
  const vs = visitsOf(id);
  const mine = !isDir() && t.supervisor === S.auth.user;
  const hasOpen = vs.some(v => v.status === 'مفتوحة');
  const done = vs.filter(v => v.status === 'مكتملة').length;
  const n = Math.max(t.planned, vs.length);
  const slots = Array.from({ length: n }, (_, i) => {
    const v = vs.find(x => x.number === i + 1);
    if (v) return visitRow(v);
    const canStart = mine && !hasOpen && i === vs.length && t.active && !String(t.id).startsWith('tmp');
    return `<div class="slot"><div class="n">${i + 1}</div><div class="b"><b class="d">الزيارة ${i + 1}</b><div class="small muted">لم تبدأ</div></div>
      ${canStart ? `<button class="btn btn-p" data-act="startVisit" data-id="${esc(id)}">${IC.plus} بدء</button>` : ''}</div>`;
  }).join('');
  const info = [['المستوى المدرَّس', t.level], ['نوع القسم', t.type], ['المستوى التعليمي', t.edu], ['الخبرة', t.experience === '' ? 'غير محددة' : t.experience + ' سنة'], ['الجنس', t.gender], ['المشرف', t.supervisor ? userName(t.supervisor) : 'غير مسند']];
  const back = isDir() ? '#/tea' : '#/';
  return {
    hero: `<div class="row" style="margin-top:14px"><button class="back" data-go="${back}">${IC.back} رجوع</button></div>
      <div style="display:flex;align-items:center;gap:14px;margin-top:14px">
        <div class="av" style="width:68px;height:68px">${ring(t.planned ? done / t.planned : 0, '#fff', 68, 4)}<div class="in" style="${avGrad(tName(t))};font-size:20px">${esc(initials(tName(t)))}</div></div>
        <div style="flex:1;min-width:0"><h1 style="margin:0;font-size:23px">${esc(tName(t))}</h1><div class="sub">${done} من ${t.planned} زيارات · ${esc(t.level || '')}</div></div>
        ${(mine || isDir()) ? `<button class="back" data-act="editTeacher" data-id="${esc(id)}">${IC.edit}</button>` : ''}</div>`,
    body: `<div class="stack">
      ${!t.active ? '<div class="banner">هذا المعلم موقوف</div>' : ''}
      <div class="card"><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(140px,1fr))">
        ${info.map(([k, v]) => `<div><div class="small muted d">${k}</div><div style="font-weight:500">${esc(v || '—')}</div></div>`).join('')}</div></div>
      <div class="sec-t" style="margin-top:18px">الزيارات</div>
      <div class="stack">${slots}</div></div>`
  };
}

/* ============================== صفحة الزيارة ============================== */
function axisTable(items, scores, c){
  const cfg = B().cfg;
  const rows = cfg.axes.filter(ax => items.some(it => it.axis === ax.id)).map(ax => {
    const counts = items.filter(it => it.axis === ax.id && it.kind !== 'علامة');
    const val = c.perAxis[ax.id];
    const cell = counts.length ? counts.map(it => `${esc(it.text)}: <b>${scores[it.id] ?? '—'}</b>`).join(' · ')
      : val !== undefined ? `<div class="row" style="gap:8px;flex-wrap:nowrap"><div class="bar" style="flex:1;min-width:60px"><i style="width:${(val - cfg.min) / (cfg.max - cfg.min) * 100}%;background:${scoreColor((val - cfg.min) / (cfg.max - cfg.min) * 100)}"></i></div><b class="d">${val.toFixed(2)}</b></div>` : '—';
    return `<tr><td class="small muted">${esc(ax.section)}</td><td>${esc(ax.name)}</td><td style="min-width:150px">${cell}</td></tr>`;
  }).join('');
  return `<div class="card tbl-wrap" style="padding:6px 12px"><table class="tbl"><thead><tr><th>القسم</th><th>المحور</th><th>المتوسط</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function viewVisit(id){
  const v = visitById(id);
  if (!v) return { body: emptyBox('الزيارة غير موجودة') };
  const t = teacher(v.teacher);
  const ss = sessionsOf(id);
  const editable = !isDir() && v.supervisor === S.auth.user && v.status === 'مفتوحة';
  const p = progress(v);
  const items = itemsFor(t ? t.type : '');
  const scores = {}; items.forEach(it => { const x = valueOf(id, it.id); if (x !== undefined) scores[it.id] = x; });
  const sess = ss.length ? `<div class="timeline">${ss.map(s => `<div class="tl"><div class="slot">
      <div class="b"><b class="d">ح${s.number} · ${esc(s.subject || 'حصة')}</b>${s.title ? `<div class="small">${esc(s.title)}</div>` : ''}
      <div class="small muted">${esc(fmtDate(s.date))}${s.from ? ' · ' + esc(s.from) + (s.to ? ' – ' + esc(s.to) : '') : ''}${(s.boys !== '' || s.girls !== '') ? ` · ذ ${esc(s.boys || 0)} · إ ${esc(s.girls || 0)}` : ''}</div></div>
      ${editable ? `<button class="ibtn" data-act="editSession" data-v="${esc(id)}" data-id="${esc(s.id)}">${IC.edit}</button>` : ''}</div></div>`).join('')}</div>`
    : emptyBox('لا توجد حصص مسجلة بعد');
  let main;
  if (v.status === 'مكتملة'){
    const c = computeScore(items, scores);
    const tr = B().cfg.trainings.filter(x => v.trainings.includes(x.id));
    main = `<div class="card" style="padding-top:22px">${gauge(v.score, v.grade)}<div class="small muted" style="text-align:center;margin-top:6px">أُغلقت في ${esc((v.closed || '').slice(0, 10))}</div></div>
      ${axisTable(items, scores, c)}

      ${tr.length ? `<div class="card"><b class="d">التكوينات المقترحة</b><div class="row" style="margin-top:8px">${tr.map(x => `<span class="chip clay">${esc(x.name)}</span>`).join('')}</div></div>` : ''}
      <button class="btn btn-p btn-block" style="min-height:52px" data-go="#/report/${esc(id)}">${IC.print} التقرير المطبوع (A4)</button>`;
  } else {
    main = `<div class="card"><div style="display:flex;align-items:center;gap:16px">
        <div class="mini-ring" style="width:76px;height:76px">${ring(p.done / (p.total || 1), p.done === p.total ? 'var(--ok)' : 'var(--v600)', 76, 7)}<b style="font-size:17px">${p.pct}%</b></div>
        <div style="flex:1"><b class="d" style="font-size:17px">${p.done} من ${p.total} بند</b><div class="small muted">${ss.length} حصة ميدانية مسجلة</div></div></div>
      ${editable ? `<div class="row" style="margin-top:14px"><button class="btn btn-p" style="flex:1" data-go="#/fill/${esc(id)}" ${ss.length ? '' : 'disabled'}>${IC.target} ملء البنود</button>
        <button class="btn btn-ok" style="flex:1" data-go="#/close/${esc(id)}" ${p.done === p.total && ss.length ? '' : 'disabled'}>${IC.check} إغلاق</button></div>
        ${ss.length ? '' : '<div class="small muted" style="margin-top:8px">سجّل حصة ميدانية أولًا، ثم املأ البنود.</div>'}`
        : `<div class="small muted" style="margin-top:10px">${isDir() ? 'عرض فقط · المشرف: ' + esc(userName(v.supervisor)) : 'هذه الزيارة لمشرف آخر'}</div>`}</div>`;
  }
  return {
    hero: `<div class="row" style="margin-top:14px"><button class="back" data-go="#/t/${esc(v.teacher)}">${IC.back} ${esc(tName(t))}</button></div>
      <h1>الزيارة ${v.number}</h1><div class="sub">${esc(tName(t))} · ${v.status === 'مكتملة' ? 'مكتملة' : 'مفتوحة'}${isDir() ? ' · ' + esc(userName(v.supervisor)) : ''}</div>`,
    body: `<div class="stack">${main}
      <div class="spread" style="margin-top:14px"><div class="sec-t" style="margin:0">الحصص الميدانية</div>${editable ? `<button class="btn btn-a" data-act="addSession" data-v="${esc(id)}">${IC.plus} حصة</button>` : ''}</div>
      ${sess}</div>`
  };
}
const AR_DAYS = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
const AR_MONTHS = ['جانفي', 'فيفري', 'مارس', 'أفريل', 'ماي', 'جوان', 'جويلية', 'أوت', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];
function fmtDate(s){ if (!/^\d{4}-\d{2}-\d{2}$/.test(s || '')) return s || ''; const d = new Date(s + 'T12:00:00'); return `${AR_DAYS[d.getDay()]} ${d.getDate()} ${AR_MONTHS[d.getMonth()]}`; }
const isoDate = d => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);

/* ============================== الملء ============================== */
let saveT = {};
function scheduleSave(vid, now){
  clearTimeout(saveT[vid]);
  setSync('busy');
  saveT[vid] = setTimeout(() => flushScores(vid), now ? 0 : 1200);
}
function flushScores(vid){
  clearTimeout(saveT[vid]);
  if (!Object.keys(getDraft(vid)).length) return;
  if (Q.jobs.some(j => j.key === 'scores' + vid)) return;
  const sessionId = S.fillSession[vid];
  enqueue({
    key: 'scores' + vid, action: 'saveScores',
    payload: () => { const d = getDraft(vid); return Object.keys(d).length ? { visitId: vid, sessionId, scores: d } : null; },
    onOk: (r, sent) => {
      B().results[vid] = r.results;
      const d = getDraft(vid);
      Object.keys(sent.scores).forEach(k => { if (d[k] === sent.scores[k]) delete d[k]; });
      setDraft(vid, d);
      if (Object.keys(d).length) scheduleSave(vid);
      if (r.edits) toast(`سُجّل ${r.edits} تعديل في سجل التعديلات`);
      const { r: rt } = route();
      if (rt === 'fill') updateFillBar(vid); else if (rt === 'v') render(true);
    }
  });
}
function setScore(vid, id, n){
  const d = getDraft(vid), saved = resultsOf(vid)[id];
  if (saved && saved.value === n) delete d[id]; else d[id] = n;
  setDraft(vid, d);
  scheduleSave(vid);
}
function fillItems(vid){ const v = visitById(vid); return itemsFor(teacher(v.teacher).type); }
function scaleClass(n){ const c = B().cfg; return 'v' + Math.min(5, Math.max(1, Math.round((n - c.min) * 4 / (c.max - c.min)) + 1)); }

function viewFill(id){
  const v = visitById(id);
  if (!v || v.status !== 'مفتوحة' || v.supervisor !== S.auth.user) return { body: emptyBox('لا يمكن ملء هذه الزيارة') };
  const t = teacher(v.teacher);
  const ss = sessionsOf(id);
  if (!ss.length){ setTimeout(() => go('#/v/' + id)); return { body: '' }; }
  if (!S.fillSession[id] || !ss.some(s => s.id === S.fillSession[id])) S.fillSession[id] = ss[ss.length - 1].id;
  const cur = ss.find(s => s.id === S.fillSession[id]);
  const items = fillItems(id);
  const done = items.filter(it => valueOf(id, it.id) !== undefined).length;
  const modeBtn = (k, l, i) => `<button class="tab ${S.fmode === k ? 'on' : ''}" data-act="fmode" data-k="${k}">${i} ${l}</button>`;
  const hero = `<div class="row" style="margin-top:14px"><button class="back" data-go="#/v/${esc(id)}">${IC.back} الزيارة ${v.number}</button></div>
    <div style="display:flex;align-items:center;gap:12px;margin-top:12px"><div style="flex:1;min-width:0"><h1 style="margin:0;font-size:22px">${esc(tName(t))}</h1>
      <div class="sub">تُنسب العلامات إلى <button class="chip" data-act="pickSessSheet" data-v="${esc(id)}" style="border:0;background:rgba(255,255,255,.2);color:#fff">ح${cur.number} · ${esc(cur.subject || 'حصة')} ▾</button></div></div>
      <div class="mini-ring" style="width:60px;height:60px" id="fRing">${ring(done / items.length, '#fff', 60, 5)}<b style="color:#fff;font-size:13px">${done}/${items.length}</b></div></div>`;
  const tabs = `<div class="tabs" style="margin-bottom:14px">${modeBtn('focus', 'وضع التركيز', IC.target)}${modeBtn('list', 'القائمة', IC.list)}</div>`;
  const bar = `<div class="fillbar"><div class="wrap"><div class="info" id="fbInfo"></div><button class="btn btn-ok" id="fbClose" data-go="#/close/${esc(id)}">${IC.check} الإغلاق</button></div></div>`;
  if (S.fmode === 'focus') return { hero, body: tabs + '<div id="focusBox"></div>', after: bar, mount: () => { drawFocus(id); updateFillBar(id); } };

  // وضع القائمة
  const cfg = B().cfg;
  let body = '', lastSec = '';
  cfg.axes.forEach(ax => {
    const its = items.filter(it => it.axis === ax.id);
    if (!its.length) return;
    const f = its.filter(it => valueOf(id, it.id) !== undefined).length;
    if (ax.section !== lastSec){ body += `<div class="sec-t" style="margin-top:18px">${esc(ax.section)}</div>`; lastSec = ax.section; }
    body += `<details class="card axis" id="ax-${esc(ax.id)}" ${f < its.length ? 'open' : ''} style="margin-bottom:10px">
      <summary>${esc(ax.name)} <span class="chip ${f === its.length ? 'ok' : ''} cnt" data-cnt="${esc(ax.id)}">${f}/${its.length}</span></summary>
      ${its.map(it => itemRow(id, it, ss)).join('')}</details>`;
  });
  return { hero, body: tabs + body, after: bar, mount: () => { updateFillBar(id); bindListFill(id); } };
}
function itemRow(vid, it, ss){
  const cfg = B().cfg;
  const val = valueOf(vid, it.id);
  const saved = resultsOf(vid)[it.id];
  const tag = saved ? `<span class="tag">ح${(ss.find(s => s.id === saved.session) || {}).number || '?'}</span>` : '';
  const ctl = it.kind === 'علامة'
    ? `<div class="scale">${range(cfg.min, cfg.max).map(n => `<button class="sv ${scaleClass(n)} ${val === n ? 'on' : ''}" data-act="pick" data-v="${esc(vid)}" data-it="${esc(it.id)}" data-n="${n}">${n}</button>`).join('')}</div>`
    : `<input class="numin" type="number" min="0" inputmode="numeric" data-num="${esc(it.id)}" value="${val ?? ''}">`;
  return `<div class="item ${val === undefined ? 'miss' : ''}" data-row="${esc(it.id)}"><div class="t">${esc(it.text)}${tag}</div>${ctl}</div>`;
}
const range = (a, b) => Array.from({ length: b - a + 1 }, (_, i) => a + i);
function bindListFill(vid){
  $$('[data-num]').forEach(inp => inp.onchange = () => {
    const raw = inp.value.trim();
    if (raw !== '' && !/^\d+$/.test(raw)) return toast('اكتب عددًا صحيحًا', true);
    if (raw === ''){ const d = getDraft(vid); delete d[inp.dataset.num]; setDraft(vid, d); }
    else setScore(vid, inp.dataset.num, Number(raw));
    inp.closest('.item').classList.toggle('miss', valueOf(vid, inp.dataset.num) === undefined);
    updateFillBar(vid);
  });
}
function updateFillBar(vid){
  const items = fillItems(vid);
  const done = items.filter(it => valueOf(vid, it.id) !== undefined).length;
  const info = $('#fbInfo');
  if (info) info.innerHTML = `<b>${done}</b> / ${items.length} بند · ${Object.keys(getDraft(vid)).length ? '<span style="color:var(--warn)">يُحفظ تلقائيًا…</span>' : '<span style="color:var(--ok)">كل شيء محفوظ</span>'}`;
  const btn = $('#fbClose'); if (btn) btn.disabled = done < items.length;
  const fr = $('#fRing'); if (fr) fr.innerHTML = ring(done / items.length, '#fff', 60, 5) + `<b style="color:#fff;font-size:13px">${done}/${items.length}</b>`;
  $$('[data-cnt]').forEach(el => { const its = items.filter(it => it.axis === el.dataset.cnt); const f = its.filter(it => valueOf(vid, it.id) !== undefined).length; el.textContent = `${f}/${its.length}`; el.classList.toggle('ok', f === its.length); });
}

/* ===== وضع التركيز: بند واحد في الشاشة ===== */
function drawFocus(vid, dir){
  const items = fillItems(vid);
  const box = $('#focusBox'); if (!box) return;
  let i = S.fidx[vid];
  if (i === undefined){ i = items.findIndex(it => valueOf(vid, it.id) === undefined); if (i < 0) i = items.length; }
  S.fidx[vid] = i;
  const done = items.filter(it => valueOf(vid, it.id) !== undefined).length;
  if (i >= items.length){
    box.innerHTML = `<div class="card focus ${dir ? 'slide-n' : ''}" style="align-items:center;justify-content:center;text-align:center">
      <div class="mini-ring" style="width:110px;height:110px">${ring(done / items.length, done === items.length ? 'var(--ok)' : 'var(--v600)', 110, 9)}<b style="font-size:22px">${done}/${items.length}</b></div>
      <h3 style="margin-top:16px;font-size:21px">${done === items.length ? 'اكتمل ملء البنود' : `بقيت ${items.length - done} بنود`}</h3>
      <div class="muted small" style="margin:6px 0 18px">${done === items.length ? 'يمكنك مراجعة أي بند أو الانتقال للإغلاق' : 'ارجع إليها لإكمال الزيارة'}</div>
      <div class="row" style="justify-content:center">${done < items.length ? '<button class="btn btn-p" data-act="fNextMissing">البند الناقص التالي</button>' : ''}<button class="btn btn-g" data-act="fGo" data-i="0">مراجعة من البداية</button></div></div>`;
    return;
  }
  const it = items[i], ax = axisOf(it.axis), cfg = B().cfg;
  const val = valueOf(vid, it.id);
  const ctl = it.kind === 'علامة'
    ? `<div class="big5">${range(cfg.min, cfg.max).map(n => `<button class="${scaleClass(n)} ${val === n ? 'on' : ''}" data-act="fPick" data-n="${n}">${n}</button>`).join('')}</div><div class="ends"><span>ضعيف</span><span>ممتاز</span></div>`
    : `<div class="stepper" style="max-width:300px;margin:0 auto"><span class="lb">العدد</span><button data-act="fStep" data-d="-1">−</button><input id="fNum" type="number" min="0" inputmode="numeric" value="${val ?? ''}" placeholder="—"><button data-act="fStep" data-d="1">+</button></div>
       <button class="btn btn-p btn-block" style="margin-top:12px" data-act="fNumOk">تأكيد والتالي</button>`;
  box.innerHTML = `<div class="card focus ${dir === 1 ? 'slide-n' : dir === -1 ? 'slide-p' : ''}" id="fCard">
    <div class="spread"><span class="where">${esc(ax.section)} › ${esc(ax.name)}</span><button class="chip v" data-act="fAxes" style="border:0">${i + 1} / ${items.length} ▾</button></div>
    <div class="bar" style="height:6px;margin-top:10px"><i style="width:${(i + 1) / items.length * 100}%"></i></div>
    <div class="q">${esc(it.text)}</div>${ctl}
    <div class="fnav"><button class="btn btn-g" data-act="fGo" data-i="${i - 1}" ${i === 0 ? 'disabled' : ''}>${IC.prev} السابق</button><button class="btn btn-g" data-act="fGo" data-i="${i + 1}">التالي ${IC.next}</button></div></div>`;
  // السحب الأفقي للتنقل
  const card = $('#fCard'); let x0 = null;
  card.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
  card.addEventListener('touchend', e => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; x0 = null; if (Math.abs(dx) > 60) fGo(vid, S.fidx[vid] + (dx > 0 ? 1 : -1)); });
}
function fGo(vid, i){
  const items = fillItems(vid);
  i = Math.max(0, Math.min(items.length, i));
  const dir = i > S.fidx[vid] ? 1 : -1;
  S.fidx[vid] = i; drawFocus(vid, dir); updateFillBar(vid);
}

function viewClose(id){
  const v = visitById(id);
  if (!v || v.status !== 'مفتوحة' || v.supervisor !== S.auth.user) return { body: emptyBox('لا يمكن إغلاق هذه الزيارة') };
  const t = teacher(v.teacher);
  const items = itemsFor(t.type);
  const scores = {}; items.forEach(it => { const x = valueOf(id, it.id); if (x !== undefined) scores[it.id] = x; });
  const missing = items.filter(it => scores[it.id] === undefined).length;
  const c = computeScore(items, scores);
  const nd = LS.get('ishraf.close.' + id) || { notes: '', trainings: [] };
  const cats = [...new Set(B().cfg.trainings.map(x => x.category))];
  return {
    hero: `<div class="row" style="margin-top:14px"><button class="back" data-go="#/v/${esc(id)}">${IC.back} الزيارة ${v.number}</button></div>
      <h1>إغلاق الزيارة</h1><div class="sub">${esc(tName(t))} · راجع النتيجة ثم أكّد</div>`,
    body: `<div class="stack">
      ${missing ? `<div class="banner">بقيت ${missing} بنود غير مملوءة، لا يمكن الإغلاق بعد.</div>` : ''}
      <div class="card" style="padding-top:22px">${gauge(c.score, c.grade)}<div class="small muted" style="text-align:center;margin-top:6px">النقطة المتوقعة — تُحسب نهائيًا عند الإغلاق</div></div>
      ${axisTable(items, scores, c)}
      <div class="card stack"><label class="field"><span>ملاحظات المشرف</span><textarea id="notes" placeholder="الملاحظات والتوجيهات التي ستظهر في التقرير">${esc(nd.notes)}</textarea></label></div>
      <div class="card stack"><b class="d">التكوينات المقترحة للمعلم</b>
        ${cats.map(cat => `<div><div class="small muted d" style="margin-bottom:8px">${esc(cat)}</div><div class="trs">
          ${B().cfg.trainings.filter(x => x.category === cat).map(x => `<button data-tr="${esc(x.id)}" class="${nd.trainings.includes(x.id) ? 'on' : ''}">${esc(x.name)}</button>`).join('')}</div></div>`).join('')}</div>
      <button class="btn btn-ok btn-block" style="min-height:54px;font-size:16.5px" data-act="closeVisit" data-v="${esc(id)}" ${missing ? 'disabled' : ''}>${IC.check} إغلاق الزيارة نهائيًا</button>
      <p class="small muted" style="text-align:center;margin:0">بعد الإغلاق لا يمكن تعديل العلامات. إعادة الفتح من الإدارة العامة فقط.</p></div>`,
    mount(){
      if (Object.keys(getDraft(id)).length) flushScores(id);
      const save = () => LS.set('ishraf.close.' + id, { notes: $('#notes').value, trainings: $$('[data-tr].on').map(x => x.dataset.tr) });
      $('#notes').oninput = save;
      $$('[data-tr]').forEach(b => b.onclick = () => { b.classList.toggle('on'); buzz(); save(); });
    }
  };
}

          ${its.map(x => `<div class="kc" draggable="true" data-tid="${esc(x.id)}" style="${x.active ? '' : 'opacity:.5'}"><b>${esc(tName(x))}</b><small>${esc(x.level || '—')} · ${esc(x.type || '')}</small></div>`).join('') || '<div class="small muted" style="text-align:center;padding:16px 0">أفلت المعلم هنا</div>'}</div>`;
      }).join('')}</div>`;
      mount = () => { bindSearch(); bindKanban(); };
    } else {
      body += `<div class="stack">${list.map(x => `<div class="slot" style="${x.active ? '' : 'opacity:.55'}">
          ${avatar(tName(x), x.planned ? visitsOf(x.id).filter(v => v.status === 'مكتملة').length / x.planned : 0, 'var(--v600)')}
          <div class="b" data-go="#/t/${esc(x.id)}" style="cursor:pointer"><b class="d">${esc(tName(x))}</b><div class="small muted">${esc(x.level || '—')} · ${esc(x.type || '')}</div></div>
          <button class="chip ${x.supervisor ? 'v' : 'warn'}" style="border:0;padding:6px 12px;font-size:13px" data-act="assignSheet" data-id="${esc(x.id)}">${esc(x.supervisor ? userName(x.supervisor) : 'إسناد')} ▾</button></div>`).join('') || emptyBox('لا يوجد معلمون')}</div>`;
      mount = bindSearch;
    }
  } else {
    const groups = sups.map(u => ({ u, vs: B().visits.filter(v => v.supervisor === u.id).sort((a, b) => (b.created || '').localeCompare(a.created || '')) })).filter(g => g.vs.length);
    body = groups.length ? groups.map(g => `<div class="sec-t" style="margin-top:14px">${esc(g.u.name)} <span class="chip v">${g.vs.length}</span></div><div class="stack">${g.vs.map(v => visitRow(v)).join('')}</div>`).join('') : emptyBox('لا توجد زيارات بعد هذا الموسم');
  }
  return { hero, body: `<div>${body}</div>`, mount };
}
function bindKanban(){
  let dragId = null;
  $$('.kc').forEach(c => {
    c.addEventListener('dragstart', e => { dragId = c.dataset.tid; c.classList.add('drag'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', dragId); });
    c.addEventListener('dragend', () => c.classList.remove('drag'));
    c.addEventListener('click', () => go('#/t/' + c.dataset.tid));
  });
  $$('.col').forEach(col => {
    col.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('over'); });
    col.addEventListener('dragleave', () => col.classList.remove('over'));
    col.addEventListener('drop', e => { e.preventDefault(); col.classList.remove('over'); const id = dragId || e.dataTransfer.getData('text/plain'); if (id) assign(id, col.dataset.col); });
  });
}
function assign(tid, sid){

function localTeacher(o){

  t.planned = ov > 0 ? ov : !Number(t.startYear) ? cfg.visitsNormal : (cfg.seasonYear - Number(t.startYear) <= 0 ? cfg.visitsNew : cfg.visitsNormal);
  return t;

function saveTeacherOptimistic(o, before){
  const visible = x => isDir() || x.supervisor === S.auth.user;
  if (o.id){
    const i = B().teachers.findIndex(x => x.id === o.id);
    const prev = Object.assign({}, B().teachers[i]);

    if (visible(nt)) B().teachers[i] = nt; else B().teachers.splice(i, 1);
    render(true); persist(); toast('تم الحفظ');

const nowHM = () => { const d = new Date(); return String(d.getHours()).padStart(2, '0') + ':' + String(Math.round(d.getMinutes() / 5) * 5 % 60).padStart(2, '0'); };
const addMin = (hm, m) => { const [h, mm] = hm.split(':').map(Number); const t = (h * 60 + mm + m) % 1440; return String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0'); };

/* ===== الساعة الدائرية ===== */
function clockPicker(value, title){
  return new Promise(res => {
    let [h, mi] = (value || '08:00').split(':').map(Number);
    let mode = 'h', result = null;
    sheet(`<h3 style="text-align:center">${esc(title)}</h3>
      <div class="clock-disp"><button id="cH"></button><span>:</span><button id="cM"></button></div>
      <svg class="dial" id="dial" viewBox="0 0 280 280"></svg>
      <div class="row" style="justify-content:center;margin-top:6px"><button class="chip v" id="cNow" style="border:0;padding:6px 14px">الآن</button></div>
      <div class="acts"><button class="btn btn-g" data-close>إلغاء</button><button class="btn btn-p" id="cOk">تم</button></div>`,
    (m, close) => {
      const svg = m.querySelector('#dial');
      const C = 140;
      const pos = (val, n, r) => { const a = (val / n) * 2 * Math.PI - Math.PI / 2; return [C + r * Math.cos(a), C + r * Math.sin(a)]; };
      const draw = () => {
        m.querySelector('#cH').textContent = String(h).padStart(2, '0');
        m.querySelector('#cM').textContent = String(mi).padStart(2, '0');
        m.querySelector('#cH').className = mode === 'h' ? 'on' : '';
        m.querySelector('#cM').className = mode === 'm' ? 'on' : '';
        let sel, labels = '';
        if (mode === 'h'){
          const inner = h === 0 || h > 12;
          sel = pos(h % 12, 12, inner ? 74 : 110);
          for (let k = 1; k <= 12; k++){ const [x, y] = pos(k % 12, 12, 110); labels += `<text x="${x}" y="${y + 5}" text-anchor="middle" class="${h === k ? 'sel' : ''}">${k}</text>`; }
          for (let k = 13; k <= 24; k++){ const v = k % 24; const [x, y] = pos(k % 12, 12, 74); labels += `<text x="${x}" y="${y + 4}" text-anchor="middle" class="inner ${h === v ? 'sel' : ''}">${String(v).padStart(2, '0')}</text>`; }
        } else {
          sel = pos(mi, 60, 110);
          for (let k = 0; k < 60; k += 5){ const [x, y] = pos(k, 60, 110); labels += `<text x="${x}" y="${y + 5}" text-anchor="middle" class="${mi === k ? 'sel' : ''}">${String(k).padStart(2, '0')}</text>`; }
        }
        svg.innerHTML = `<circle cx="${C}" cy="${C}" r="134" fill="var(--soft)"/>
          <line x1="${C}" y1="${C}" x2="${sel[0]}" y2="${sel[1]}" stroke="var(--v600)" stroke-width="3" stroke-linecap="round"/>
          <circle cx="${C}" cy="${C}" r="5" fill="var(--v600)"/>
          <circle cx="${sel[0]}" cy="${sel[1]}" r="19" fill="var(--v600)"/>${labels}`;
      };
      const pick = (e, final) => {
        const r = svg.getBoundingClientRect();
        const x = (e.clientX - r.left) * 280 / r.width - C, y = (e.clientY - r.top) * 280 / r.height - C;
        let a = Math.atan2(y, x) + Math.PI / 2; if (a < 0) a += 2 * Math.PI;
        const dist = Math.hypot(x, y);
        if (mode === 'h'){
          let k = Math.round(a / (2 * Math.PI) * 12) % 12;
          const nh = dist < 92 ? (k === 0 ? 0 : k + 12) : (k === 0 ? 12 : k);
          if (nh !== h){ h = nh; buzz(4); }
        } else {
          const nm = Math.round(a / (2 * Math.PI) * 12) % 12 * 5;
          if (nm !== mi){ mi = nm; buzz(4); }
        }
        draw();
        if (final && mode === 'h'){ setTimeout(() => { mode = 'm'; draw(); }, 220); }
      };
      let down = false;
      svg.onpointerdown = e => { down = true; svg.setPointerCapture(e.pointerId); pick(e); };
      svg.onpointermove = e => { if (down) pick(e); };
      svg.onpointerup = e => { down = false; pick(e, true); };
      m.querySelector('#cH').onclick = () => { mode = 'h'; draw(); };
      m.querySelector('#cM').onclick = () => { mode = 'm'; draw(); };
      m.querySelector('#cNow').onclick = () => { [h, mi] = nowHM().split(':').map(Number); draw(); };
      m.querySelector('#cOk').onclick = () => { result = String(h).padStart(2, '0') + ':' + String(mi).padStart(2, '0'); close(); };
      draw();
    }, () => res(result));
  });
}

      <div class="small muted">حمّل النموذج، املأه بسطر لكل معلم، ثم ارفعه هنا.${isDir() ? ' يمكنك إضافة عمود «المشرف» باسمه كما في التطبيق.' : ''}</div>
      <button class="btn btn-g" id="tpl">${IC.xls} تحميل النموذج</button>
      <label class="card" style="display:flex;flex-direction:column;align-items:center;gap:8px;border:2px dashed var(--v300);cursor:pointer;box-shadow:none;text-align:center">
        ${IC.xls}<b class="d">اختر ملف إكسل</b><span class="small muted" id="fname">xlsx · xls · csv</span>
        <input type="file" id="xf" accept=".xlsx,.xls,.csv" style="display:none"></label>

    <div class="acts"><button class="btn btn-g" data-close>إلغاء</button><button class="btn btn-p" id="doImp" disabled>استيراد</button></div>`,
  (m, close) => {
    let rows = [];
    m.querySelector('#tpl').onclick = async () => {
      try{
        await loadXLSX();
        const L = B().cfg.lists;
        const head = IMPORT_COLS.map(c => c[0]).concat(isDir() ? ['المشرف'] : []);
        const ex = ['بن أحمد', 'محمد', 'عمر', 'ذكر', (L['المستويات المدرَّسة'] || [''])[1] || '', (L['المستوى التعليمي'] || [''])[0] || '', (L['نوع القسم'] || [''])[0] || '', 2020];
        const ws = XLSX.utils.aoa_to_sheet([head, ex]);
        ws['!cols'] = head.map(() => ({ wch: 18 }));
        const wb = XLSX.utils.book_new(); wb.Workbook = { Views: [{ RTL: true }] };
        XLSX.utils.book_append_sheet(wb, ws, 'المعلمون');
        XLSX.writeFile(wb, 'نموذج_المعلمين.xlsx');
      } catch(e){ toast(e.message, true); }
    };
    m.querySelector('#xf').onchange = async e => {
      const f = e.target.files[0]; if (!f) return;
      m.querySelector('#fname').textContent = f.name;
      try{
        await loadXLSX();
        const wb = XLSX.read(await f.arrayBuffer());
        const raw = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '' });
        const sups = B().users.filter(u => u.role === 'مشرف');
        rows = raw.map(r => {
          const o = {}, keys = {};
          Object.keys(r).forEach(k => keys[normHeader(k)] = r[k]);
          IMPORT_COLS.forEach(([h, k]) => o[k] = String(keys[normHeader(h)] ?? '').trim());
          if (isDir()){ const su = sups.find(u => u.name === String(keys['المشرف'] ?? '').trim()); o.supervisor = su ? su.id : ''; }
          return o;
        }).filter(o => o.last || o.first);
        const types = B().cfg.lists['نوع القسم'] || [];
        const bad = rows.filter(o => !o.last || !o.first || (types.length && !types.includes(o.type))).length;
        m.querySelector('#prev').innerHTML = rows.length ? `<div class="banner v">${rows.length} معلمًا في الملف${bad ? ` · <span style="color:var(--bad)">${bad} سطرًا ناقص</span>` : ''}</div>
          <div class="tbl-wrap" style="max-height:200px;overflow:auto;margin-top:8px"><table class="tbl"><tbody>
          ${rows.slice(0, 50).map(o => `<tr><td>${esc(o.last)} ${esc(o.first)}</td><td class="small">${esc(o.level)}</td><td class="small" style="${types.includes(o.type) ? '' : 'color:var(--bad)'}">${esc(o.type || 'ناقص')}</td></tr>`).join('')}</tbody></table></div>`
          : '<div class="banner">لم أجد معلمين في الملف. تأكد من عناوين الأعمدة.</div>';
        m.querySelector('#doImp').disabled = !rows.length;
      } catch(err){ toast('تعذّرت قراءة الملف: ' + err.message, true); }
    };
    m.querySelector('#doImp').onclick = async e => {
      try{
        const r = await busy(e.currentTarget, () => api('importTeachers', { rows }));
        r.added.forEach(t => { if (isDir() || t.supervisor === S.auth.user) B().teachers.push(t); });
        persist(); close(); render(true);
        const msg = `أُضيف ${r.added.length} معلمًا` + (r.skipped.length ? ` · ${r.skipped.length} مكرر` : '') + (r.errors.length ? ` · ${r.errors.length} أخطاء` : '');
        if (r.errors.length) sheet(`<h3>نتيجة الاستيراد</h3><p>${esc(msg)}</p><div class="tbl-wrap"><table class="tbl"><thead><tr><th>السطر</th><th>الخطأ</th></tr></thead><tbody>${r.errors.map(x => `<tr><td>${x.line}</td><td>${esc(x.error)}</td></tr>`).join('')}</tbody></table></div><div class="acts"><button class="btn btn-p" data-close>حسنًا</button></div>`);
        else toast(msg);
      } catch(err){ toast(err.message, true); }
    };
  });
}

/* ============================== التقرير المطبوع ============================== */
const ORD = ['الأولى', 'الثانية', 'الثالثة', 'الرابعة', 'الخامسة', 'السادسة'];
const SCOL = ['#E5484D', '#F08A3E', '#E8B730', '#7BBF4E', '#13A26C'];
const sHex = n => SCOL[Number(scaleClass(n).slice(1)) - 1];
const pct100 = avg => { const c = B().cfg; return Math.round((avg - c.min) / (c.max - c.min) * 100); };

function renderReport(id){

  if (!v || v.status !== 'مكتملة'){ $('#app').innerHTML = `<div class="rp-bar"><button class="back" data-go="#/">${IC.back} رجوع</button></div><div class="wrap">${emptyBox('التقرير متاح للزيارات المكتملة فقط')}</div>`; return; }
  const t = teacher(v.teacher), cfg = B().cfg, items = itemsFor(t.type), ss = sessionsOf(id);
  const scores = {}; items.forEach(it => { const x = valueOf(id, it.id); if (x !== undefined) scores[it.id] = x; });

  const pupils = ss.filter(s => s.boys !== '' || s.girls !== '').map(s => `ح${s.number}: ذ ${s.boys || 0} / إ ${s.girls || 0}`).join(' · ');

        const val = scores[it.id];
